name: Release consistency — tüm asset'ler AYNI damga mı?

# Post-release guard: ALL binary assets of a release (linux/plesk/windows/docker)
# must carry the same git-sha stamp. Because Windows is built BY HAND and uploaded (Tier 2, not in automation)
# it CAN DIVERGE from the others -- and this HAS HAPPENED: in the 403d2dd release Linux/Plesk/
# Docker were updated, Windows stayed at 5465074, and it went unnoticed until someone pointed it out by hand.
# This guard closes that class -- without setting up an MSVC CI (the Windows binary is NOT RUN on a Linux runner;
# `grep` verifies that the reference stamp is inside the .exe).
#
# Positive control: put an old-stamped binary into an asset -> the guard must go RED.

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Kontrol edilecek release tag'i"
        required: false
        default: "v1.0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Repo: for the guard that reads the binaries named in the docs (cpp/tests/package_binaries_guard.sh).
      - uses: actions/checkout@v4
      - name: Asset'leri indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'look-lang-linux-*.zip' --pattern 'look-lang-plesk-*.zip' \
            --pattern 'look-lang-windows-*.zip' --pattern 'look-docker.tar.gz' \
            --dir assets --clobber
          ls -lh assets

      - name: Damgaları çıkar + AYNI mı doğrula (fail-loud)
        run: |
          set -e
          cd assets
          # --- REFERENCE: Linux binary (CI-built, authoritative) ---
          unzip -oq look-lang-linux-*.zip -d linux
          REF=$(linux/bin/lk --version | sed -n 's/.*(\([0-9a-f]\{7\}\),.*/\1/p')
          [ -n "$REF" ] || { echo "::error::Linux damgası okunamadı"; exit 1; }
          echo "Referans damga (linux): $REF"

          fail=0
          # --- Plesk: the binary is at htdocs/bin/lk (MEASURED -- not 'bin/lk'; the first guard looked at the wrong path
          #     and SILENTLY SKIPPED = empty-green, a rule violation). FAIL if not found: Plesk
          #     drift history is the worst artifact, a silent skip is not allowed. If packaging deliberately stops
          #     carrying a binary the guard goes RED -> forces a decision to UPDATE the guard. ---
          unzip -oq look-lang-plesk-*.zip -d plesk
          if [ -f plesk/htdocs/bin/lk ]; then
            chmod +x plesk/htdocs/bin/lk
            P=$(plesk/htdocs/bin/lk --version | sed -n 's/.*(\([0-9a-f]\{7\}\),.*/\1/p')
            [ "$P" = "$REF" ] && echo "  OK   plesk  $P" || { echo "  FAIL plesk  $P != $REF"; fail=1; }
          else
            echo "  FAIL plesk: htdocs/bin/lk YOK — paketleme bozuk (binary bekleniyordu, sessiz-skip YOK)"; fail=1
          fi

          # --- Docker: load + run ---
          IMG="$(docker load < look-docker.tar.gz | sed -n 's/^Loaded image: //p' | head -1)"
          D=$(docker run --rm "$IMG" lk --version | sed -n 's/.*(\([0-9a-f]\{7\}\),.*/\1/p')
          [ "$D" = "$REF" ] && echo "  OK   docker $D" || { echo "  FAIL docker $D != $REF"; fail=1; }

          # --- Windows: WITHOUT RUNNING -- does the reference stamp appear inside the .exe (strings/grep) ---
          unzip -oq look-lang-windows-*.zip -d win
          if grep -aq "$REF" win/lk.exe && grep -aq "$REF" win/lk-fcgi.exe && grep -aq "$REF" win/lk-cgi.exe; then
            echo "  OK   windows (damga $REF .exe içinde)"
          else
            echo "  FAIL windows: $REF lk.exe/lk-fcgi.exe/lk-cgi.exe içinde YOK (eski elle-derleme?)"; fail=1
          fi
          # Is every binary named in the docs (including lk-cgi) in the package
          bash ../cpp/tests/package_binaries_guard.sh look-lang-linux-[0-9]*.zip look-lang-plesk-[0-9]*.zip \
            look-lang-windows-[0-9]*.zip || fail=1

          echo ""
          if [ "$fail" != 0 ]; then
            echo "::error::Asset damgaları AYRIŞIYOR — yayın tutarsız (Windows elle-adım unutulmuş olabilir)"
            exit 1
          fi
          echo "TUTARLI: tüm asset'ler $REF"

      # MANIFEST COVERAGE LOCK: the stamp check verifies that the assets are the SAME but not that ALL of them
      # are in SHA256SUMS. If an asset drops out of the manifest (the vsix did in this round) it is downloaded
      # but cannot be verified -- a silent regression. Count lock: asset count (excluding SHA256SUMS.txt) ==
      # manifest line count. Same as the crypto_vectors EXPECTED_VECTORS pattern (a count lock against empty-green).
      # Positive control: delete a line from the manifest -> assets > lines -> RED.
      - name: Manifest kapsamı — her asset SHA256SUMS'ta mı (sayı-kilidi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'SHA256SUMS.txt' --dir manifest --clobber
          MANIFEST_LINES=$(grep -cE '^[0-9a-f]{64}' manifest/SHA256SUMS.txt)
          ASSET_COUNT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '[.assets[].name | select(. != "SHA256SUMS.txt")] | length')
          echo "manifest satır: $MANIFEST_LINES | asset (SHA256SUMS hariç): $ASSET_COUNT"
          if [ "$MANIFEST_LINES" != "$ASSET_COUNT" ]; then
            echo "::error::SHA256SUMS $MANIFEST_LINES satır ama $ASSET_COUNT asset var — bir asset manifest KAPSAMI DIŞINDA (indirilir ama doğrulanamaz)"
            exit 1
          fi
          echo "MANİFEST TAM: $ASSET_COUNT asset, hepsi SHA256SUMS'ta"
