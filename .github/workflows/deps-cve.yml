name: deps-cve

# Vendored-dependency CVE watch. The vendored / statically-linked third-party
# components (SQLite, OpenSSL, miniz, linenoise) are compiled into the binary, so
# "no runtime dependencies" does NOT mean they never need patching — a CVE against a
# pinned version ships inside every release until the copy is bumped. This job checks
# the pinned versions (infra/sbom/look-vendored.cdx.json) against NVD on a schedule.
#
# It runs on a schedule + manual dispatch, NOT on push/PR: CVE databases change
# independently of the code, so a red run here is an alert to bump a vendored copy,
# not a merge blocker.

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NVD CVE check of vendored versions
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional; raises the rate limit
        run: python3 infra/sbom/nvd_cve_check.py infra/sbom/look-vendored.cdx.json | tee cve-report.txt

      - name: Open/refresh an issue on findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "The vendored-dependency CVE scan found CVE(s) applicable to the pinned versions. Bump the vendored copy (THIRD_PARTY.md + infra/sbom/look-vendored.cdx.json + rebuild/re-release).\n\n```\n";
            try { body += fs.readFileSync('cve-report.txt','utf8').slice(0, 60000); } catch (e) {}
            body += "\n```";
            const title = "Vendored dependency CVE(s) detected";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "deps-cve" });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["deps-cve","security"] });
            }
