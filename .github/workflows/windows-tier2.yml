name: Windows Tier 2 (manual)

# workflow_dispatch ONLY — deliberately NOT wired to push yet.
#
# Rule (cpp/tests/README.md): a leg is not added to push-CI until it is proven
# green. This job lets us prove the Windows Tier 2 core green on the real
# windows-latest runner WITHOUT reddening main. The first few runs will likely
# fail on ENVIRONMENT (MSVC generator, .lk paths, line endings) not on code —
# that is setup work, iterate here freely.
#
# ONCE this is reliably green, add the push trigger below and it becomes the
# Tier 2 gate (blocks a merge, NOT a release — see SECURITY.md#platform-support-tiers):
#   on:
#     workflow_dispatch:
#     push:
#       branches: ["**"]
#
# SCOPE = platform-independent core ONLY, matching the tier policy exactly.
# NO differential_test.sh / TSan / fuzz / smtp-imap / Docker / Plesk — those are
# POSIX-only (bash harnesses, sanitizers absent on MSVC). If this job and the
# written policy ever diverge, the policy is the source of truth.

on:
  workflow_dispatch:

jobs:
  windows-tier2:
    name: "Windows x86_64 (MSVC) — Tier 2 core"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash    # git-bash ships on windows-latest; keeps steps identical to Linux CI

    steps:
      - uses: actions/checkout@v4

      # MSVC + CMake are preinstalled on windows-latest. TLS = Schannel
      # (ws2_32 + bcrypt), no OpenSSL; SQLite is amalgamated -> no extra deps.
      - name: Build lk (MSVC Release)
        run: |
          cd cpp
          cmake -B build
          cmake --build build --config Release --target look

      # Interpreter regression — prints OK/FAIL; any FAIL line fails the job.
      - name: Regression suite (interpreter)
        run: |
          cd cpp
          out="$(./build/Release/lk.exe tests/regression_all.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::Regression FAILED on Windows"
            exit 1
          fi

      # Crypto known-answer vectors — exits 1 on a wrong vector OR on vacuous run
      # (EXPECTED_VECTORS guard). Exercises the random_bytes Windows branch
      # (BCryptGenRandom) — never CI-tested before this job.
      - name: Crypto known-answer vectors
        run: |
          cd cpp
          ./build/Release/lk.exe tests/crypto_vectors.lk

      # Release gate — the 7 security/correctness assertions; chk() exits 1 on any FAIL.
      - name: Release gate
        run: |
          cd cpp
          ./build/Release/lk.exe tests/release_gate.lk
