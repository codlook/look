name: CI — Build & Regression

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: "Clean Linux build + regression suite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev

      # Temiz bir GCC/Linux ortamında derleme — portability regresyonlarını
      # (ör. eksik <cstdint>) burada yakalar; MSVC'nin transitive include'ları
      # gizleyebildiği sorunlar CI'da ortaya çıkar.
      - name: Build lk + lk-fcgi + lk-cgi (Release)
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          # look-cgi DE derlenir: yalnız look+look-fcgi derlemek look-cgi'yi kör bırakıyordu —
          # Katman 0 (is_reserved_builtin) look-cgi link'ini sessizce kırdı, yalnız 3-target
          # release build yakaladı (kırık lk-cgi = Plesk CGI yolu yayınlanacaktı). 3 target = kapalı.
          cmake --build build --target look --target look-fcgi --target look-cgi --parallel $(nproc)

      # Interpreter regresyon suite — assertion dosyası "OK/FAIL" basar.
      # Herhangi bir FAIL satırı işi kırar.
      - name: Regression suite (interpreter)
        run: |
          cd cpp
          out="$(./build/lk tests/regression_all.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::Regression FAILED"
            exit 1
          fi
          echo "All assertions passed."

      # Kripto known-answer testi — el-yazması SHA-256/HMAC/base64'ü NIST FIPS 180-4 +
      # RFC 4231/4648 vektörlerine pinler. differential yalnız motorları KARŞILAŞTIRIR
      # (üçü de aynı yanlışı verse geçer); bu SPEC'e karşı doğrular. exit 1 ile fail-loud.
      - name: Crypto known-answer vectors
        run: |
          cd cpp
          ./build/lk tests/crypto_vectors.lk

      # RS256 known-answer — crypto_vectors sha/hmac/base64'ü kapsıyordu ama rs256'yı
      # kapsamıyordu (olgunluk denetimi 2026-08-11 boşluğu). Sabit imza (openssl dış
      # oracle, PKCS#1 v1.5 deterministik) + reddetme tarafı (bozuk mesaj/imza). POSIX
      # yolu burada TAM doğrulanır; Windows verify STUB (throw) — bu KAT, Windows NCrypt
      # impl'i geldiğinde onu AYNI imzaya karşı doğrulayacak silahtır.
      - name: RS256 known-answer (verify + reject + deterministik sign)
        run: |
          cd cpp
          ./build/lk tests/rs256_kat.lk

      # date:: DST regresyon — add/sub/diff gün-aritmetiği TAKVİM-tabanlı mı. Eski
      # 86400-saniye yolu DST fall-back'te (25s gün) +1 günü AYNI güne kaydırıyordu
      # (sessiz 1-gün: abonelik/rezervasyon). DST'li TZ ŞART — UTC tek başına görmez.
      - name: date DST (calendar arithmetic, TZ=America/New_York)
        run: |
          cd cpp
          TZ=America/New_York ./build/lk tests/date_dst_test.lk
          TZ=UTC ./build/lk tests/date_dst_test.lk

      # DKIM tag-parser ① KAT — RFC 6376 tag ayirma dogru mu (bh= icindeki h='e carpmasin).
      # Saf parser (look/dkim_tag.h), pozitif kontrollu: eski find() parser'i ①'de bozuk.
      - name: DKIM tag-parser KAT
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/dkim_tag_test.cpp -o /tmp/dkim_tag_test
          /tmp/dkim_tag_test

      # DKIM verify tablo testi — seam (dkim_verify_with_key) + ② çoklu-From FAIL-SAFE.
      # Pozitif kontrol (geçerli imza→TRUE) + iki yön çoklu-From→FALSE. Bir refactor bu
      # fail-safe davranışı bozarsa (find/rfind aynı From'a yaklaşırken) KIRMIZI.
      - name: DKIM verify table (seam + çoklu-From)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/dkim_verify_test.cpp src/dkim.cpp src/dns.cpp \
            -lssl -lcrypto -lresolv -o /tmp/dkim_verify_test
          /tmp/dkim_verify_test

      # SMTP adres parser tablo testi — seam (look/smtp_parse.h) + geçmiş bug'lar (bare
      # adres, <> null-sender, iç içe '<') kilitli. ASan+UBSan: adversarial + 100K girdide
      # OOB/çökme yok. Ağa açık PRE-AUTH kod; bir refactor sağlamlığı bozarsa KIRMIZI.
      - name: SMTP addr parser table (seam + adversarial)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/smtp_parse_test.cpp -o /tmp/smtp_parse_test
          /tmp/smtp_parse_test

      # IMAP parser tablo testi — seam (look/imap_parse.h): parse_command/split_two +
      # mailbox_name_ok GÜVENLİK guard'ı. Belgeli geçmiş bug `INBOX; rm -rf /` KABUL'dü;
      # artık RED (kilitli). ASan+UBSan: adversarial + 100K çökme yok.
      - name: IMAP parser table (seam + mailbox guard)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/imap_parse_test.cpp -o /tmp/imap_parse_test
          /tmp/imap_parse_test

      # SMTP runtime guard'ları — gerçek sunucu ayağa kaldırılıp ham SMTP konuşulur.
      #  1) smtp_test.sh: adres ayrıştırma + relay + per-IP limit + fd sızıntısı.
      #  2) smtp_slowloris_test.sh: EventLoop idle-timeout POZİTİF KONTROL — idle
      #     bağlantı timeout sonra kapanır, aktif bağlantı kapanmaz, conn_count sızmaz.
      #     (Non-blocking ET soketinde SO_RCVTIMEO çalışmaz → koruma EventLoop katmanında.)
      - name: SMTP runtime (parser + relay + slowloris idle-timeout)
        run: |
          cd cpp
          bash tests/smtp_test.sh build/lk-fcgi 7826
          bash tests/smtp_slowloris_test.sh build/lk-fcgi 7830

      # Motor paritesi — bu guard'lar repoda vardı ama HİÇBİR workflow'da koşmuyordu
      # (olgunluk denetimi 2026-08-11: "guard var, CI'da yok" = regresyon manuel-koşuma
      # bağlı). Şimdi bağlandı. differential = tree-walk/CLI-VM/web-VM 22 kat×3 birebir;
      # closure = 12 vaka parite; recursion = graceful stack-overflow; parallel_db = iki
      # motorda conn-sızıntısı + havuz baskısı. (differential yol-çözme bug'ı düzeltildi:
      # alt-testler $TMP'ye cd ediyordu, göreli build/lk çözülmüyordu.)
      - name: Motor paritesi (differential + closure + recursion + parallel)
        run: |
          cd cpp
          bash tests/differential_test.sh build/lk build/lk-fcgi
          bash tests/closure_semantics_test.sh build/lk
          bash tests/vm_recursion_test.sh build/lk
          bash tests/parallel_db_test.sh build/lk-fcgi
          bash tests/finally_ret_test.sh build/lk   # finally return/break/continue (VM+interp parity)

      # HTTP sertleştirme runtime — request smuggling (çift-CL/TE-varyant/obs-fold) +
      # slowloris header-deadline. Testler vardı, CI'da değildi.
      - name: HTTP sertleştirme (smuggling + slowloris)
        run: |
          cd cpp
          bash tests/http_smuggle_test.sh build/lk-fcgi
          bash tests/http_slowloris_test.sh build/lk-fcgi 7622

      # SSE sse::close() fd-sızıntısı — bug-avı bulgusu (957d11e). Sunucu sse::close çağırınca
      # fd/epoll/map istemci TCP-kopana kadar sızıyordu (+ soket kapanmadığı için istemci asılı).
      # fd-sayacı guard'ı (TSan bu fd-yaşam yarışına kör). Pozitif kontrol: fix öncesi fd=base+1.
      - name: SSE sse::close fd-sızıntısı (runtime)
        run: |
          cd cpp
          bash tests/sse_close_test.sh build/lk-fcgi 7768

      # WS close + fd-sızıntısı — fonksiyonel (TSan-siz), ham-socket handshake (python3 stdlib).
      # handshake 101 → echo → istemci close-frame → server close + fd serbest + ani-kopma
      # regresyonu. WS EWOULDBLOCK (yavaş-istemci write-drop) kapsam dışı (ayrı yük-testi).
      - name: WS close fd-sızıntısı (runtime)
        run: |
          cd cpp
          bash tests/ws_close_test.sh build/lk-fcgi 7769

      # Güvenlik repro'ları — ReDoS/F-01 thread sızıntısı, file-root path-traversal
      # (encoded/çift-encoded), i64 overflow. NOT: msvc_mul_ovf Linux yolunu kilitler;
      # MSVC dalı Windows CI gerektirir (olgunluk denetimi Tema B).
      - name: Güvenlik repro'ları (ReDoS + traversal + i64)
        run: |
          cd cpp
          build/lk tests/repro/regex_leak_check.lk
          build/lk tests/repro/file_root_traversal.lk
          build/lk tests/repro/msvc_mul_ovf.lk

      # Davranışsal .lk testleri — gömülü SQLite / in-process (harici sunucu YOK). Bu
      # kalemler eskiden "TEST-EDİLMİŞ ama CI-dışı"ydı (env-DSN/canlı-DB isterdi); SQLite
      # backend + in-process thread ile çekirdek davranış CI'da KANITLANIR. db:: CRUD+tx,
      # jobs:: lifecycle+retry, parallel() fan-out+izolasyon, prepared bind matrisi.
      # (mail:: harici HTTP-provider ister → CI-dışı; MySQL/PG wire-lehçesi ayrı canlı-DSN.)
      - name: Davranışsal (db/jobs/parallel/prepared, SQLite)
        run: |
          cd cpp
          bash tests/behavioral_test.sh build/lk

      # PG DSN TLS-karar tablo testi — seam (look/db_dsn.h). sslmode/tls→(tls,verify) mantığı
      # ağsız kilitlenir; verify-ca sessiz-plaintext regresyonu (558d735) POZİTİF-KONTROLLÜ
      # (verify-ca dalı silinirse verify-ca vakası tls=false → FAIL). Gerçek TLS-handshake
      # matrisi (db_tls/, Docker+cert) ayrı/nightly kalır — bu yalnız parse ekseni.
      - name: PG DSN TLS-karar tablosu (seam + verify-ca regresyonu)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/pg_dsn_test.cpp -o /tmp/pg_dsn_test
          /tmp/pg_dsn_test

      # MySQL/Redis DSN TLS-karar — seam (look/db_dsn.h). PG'den fark: verify=false VARSAYILAN
      # (DB cert self-signed; kablo-şifreleme amaç). Ağsız tablo mevcut kararı kilitler; varsayılan
      # bir gün değişirse (kırıcı-karar) RED. POZİTİF-KONTROLLÜ.
      - name: MySQL/Redis DSN TLS-karar (seam tablosu)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/mysql_redis_dsn_test.cpp -o /tmp/mrdsn
          /tmp/mrdsn

      # MySQL multi-packet birleştirme — seam (look/mysql_wire_parse.h). read_packet 0xFFFFFF
      # devam paketlerini birleştirmeli (yoksa 16MB+ payload'da havuz-bağlantısı YANLIŞ VERİ döner).
      # Reader bellek-tamponu → canlı MySQL YOK. cap/0-terminatör/kopuk-akış POZİTİF-KONTROLLÜ.
      - name: MySQL multi-packet birleştirme (seam tablosu)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/mysql_reassemble_test.cpp -o /tmp/mra
          /tmp/mra

      # SHA-256 / HMAC / PBKDF2 RFC known-answer — seam (look/crypto_sha256.h). Bu üçlü
      # JWT(HS256)/DKIM/session/auth'u besler; "kendi çıktısına değil SPEC'e pinle": NIST SHA-256
      # + RFC 4231 HMAC + RFC 7914 PBKDF2 vektörleri. POZİTİF-KONTROLLÜ. Yeni builtin YOK.
      - name: SHA-256/HMAC/PBKDF2 RFC-KAT (seam)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/crypto_sha256_test.cpp -o /tmp/csha
          /tmp/csha

      # PG SCRAM crypto agreement — GERÇEK PostgresClient::sha256/hmac/pbkdf2 (postgres_client.cpp)
      # aynı RFC vektörlerine pinli mi? Bu üçlü artık look::crypto_sha256.h'ye array<32>↔vector
      # adaptörüyle DELEGE eder (paralel kopya birleştirildi); test regresyon-guard'ı: adaptör bağı
      # koparsa/tek-block yol kayarsa vektör tutmaz → RED. postgres_client.cpp + OpenSSL link eder.
      - name: PG SCRAM crypto agreement RFC-KAT (seam)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/pg_scram_crypto_kat.cpp src/postgres_client.cpp \
              -lssl -lcrypto -o /tmp/pgkat
          /tmp/pgkat

      # PG TLS GERÇEK handshake — mock TLS PG sunucusu (python ssl, self-signed cert), Docker YOK.
      # verify-full untrusted cert'i REDDEDER (SSL_VERIFY_PEER çalışıyor mu) + insecure kabul
      # eder (pozitif-kontrol: red verify'dan; verify kırık olsa insecure gibi davranırdı).
      - name: PG TLS gerçek-handshake verify (mock, Docker'sız)
        run: |
          cd cpp
          bash tests/pg_tls_handshake_test.sh build/lk 7799

      # installer:: parse-katmanı — AĞSIZ (parse_pkg redleri indirmeden ÖNCE): host kısıtı
      # (yalnız github.com), geçersiz ad, path-traversal (user + subdir). Pozitif-kontrol:
      # meşru ad parse'ı geçmeli. (Zip-slip/redirect gerçek indirme ister → C++ unit-test
      # hedefli-takip; tam installer_test.sh ağlı → manuel/nightly.)
      - name: "installer:: parse-katmanı (host/ad/traversal, ağsız)"
        run: |
          cd cpp
          bash tests/installer_parse_test.sh build/lk

      # installer:: Zip-Slip containment — güvenlik-kararı seam (look/zip_safe.h). Gerçek
      # extract/miniz OLMADAN: entry dest içine mi açılır. Sibling-prefix kaçışı (repo→repo-evil,
      # ayırıcı-sınır zorunlu) dahil, POZİTİF-KONTROLLÜ (sınır kaldırılırsa sibling-prefix kaçar→FAIL).
      - name: "installer:: Zip-Slip containment (seam tablosu)"
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/installer_zipslip_test.cpp -o /tmp/izt
          /tmp/izt

      # installer:: redirect güvenlik-kararı seam (look/url_safe.h). Gerçek HTTP/3xx OLMADAN:
      # şema-düşürme (http://) + host-kaçışı (evilgithub.com / github.com.evil.com) reddi.
      # POZİTİF-KONTROLLÜ (https zorunluluğu kaldırılırsa http:// kaçar→FAIL).
      - name: "installer:: redirect güvenlik-kararı (seam tablosu)"
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/installer_redirect_test.cpp -o /tmp/irt
          /tmp/irt

      # SSRF private/özel-blok kararı — seam (look/ssrf_safe.h). http_client'ın getaddrinfo
      # döngüsü bu predikatlara delege eder. Ağsız/DNS'siz: ham byte'tan karar tablosu
      # (metadata 169.254.169.254 · NAT64 64:ff9b · 6to4 2002 · v4-mapped bypass'ları).
      # POZİTİF-KONTROLLÜ (bir dal silinirse ilgili satır RED).
      - name: SSRF private/özel-blok kararı (seam tablosu)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/ssrf_safe_test.cpp -o /tmp/ssrf
          /tmp/ssrf

      # int64 taşma-tespiti — seam (look/int_overflow.h). operator+/-/* taşınca float promote
      # (signed-overflow UB YOK). Taşma sınırları + INT64_MIN*-1 #DE(SIGFPE) tuzağı tablo-test.
      # POZİTİF-KONTROLLÜ. (Linux/CI __builtin dalı; MSVC dalı Tier-2 Windows.)
      - name: int64 taşma-tespiti (seam tablosu)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/int_overflow_test.cpp -o /tmp/iov
          /tmp/iov

      # session:: SID doğrulama + blob enjeksiyon savunması — seam (look/session_esc.h).
      # Ağsız: 32-hex allowlist (traversal reddi) + \n/= enjeksiyonu ile uydurma yetki-alanı
      # (admin=1) ENJEKTE EDİLEMEZ. POZİTİF-KONTROLLÜ (değer-kaçırma kalkarsa enjeksiyon geçer).
      - name: "session:: SID + blob enjeksiyon (seam tablosu)"
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/session_esc_test.cpp -o /tmp/sess
          /tmp/sess

      # docs-conformance — docs'taki her mod::fn çekirdekte (builtin_names) var mı?
      # session::has sınıfını (docs vaat ediyor, çekirdek yok → kullanıcı 500) toplu kapatır.
      # Saf metin karşılaştırması (build yok); allowlist gerekçeli, yeni drift fail eder.
      - name: docs-conformance (docs API ↔ builtin_names)
        run: bash cpp/tests/docs_conformance.sh

      # SSRF DNS-rebinding pin değişmezi — ölçüldü: is_ssrf_blocked + connect AYNI çözümlenmiş
      # res->ai_addr'ı kullanır (resolve-once, yeniden-çözme yok → rebinding imkânsız). Bu guard
      # kaynak-değişmezini kilitler; biri connect'i yeniden-çözmeye çevirirse RED. Pozitif-kontrollü.
      - name: SSRF DNS-rebinding pin değişmezi (kaynak guard)
        run: bash cpp/tests/ssrf_pin_guard.sh

      # Plesk installer privesc-sağlamlaştırma — ağsız, Plesk'siz. Domain/script/svc sanitizasyonu
      # (PHP regex + bash tr -cd + case guard) enjeksiyonu (satır-sonu→systemd unit root-komut)
      # engelliyor mu? Pozitif-kontrollü (sanitizasyon kalkarsa privesc payload'ı 2-satır unit üretir).
      - name: "Plesk installer enjeksiyon-guard'ları (ağsız)"
        run: |
          sudo apt-get install -y php-cli
          bash cpp/tests/plesk_inject_test.sh
          php  cpp/tests/plesk_php_domain_test.php

      # VM→interpreter fallback DOĞRULUK — LOOK_VM_FORCE_FAIL test-hook'u bir route'u VM'de kasıtlı
      # fail ettirir; fallback yanıtı VM'inkiyle AYNI olmalı + 'VM BUG' loglamalı; STRICT=1 ile 500.
      # Pozitif-kontrollü (fallback yanlış hesaplarsa RED). Hook prod-inert (env yoksa tek pointer testi).
      - name: VM→interpreter fallback doğruluk (runtime)
        run: |
          cd cpp
          bash tests/vm_fallback_test.sh build/lk-fcgi 7772

      # JWT güvenlik tablosu — HS256 modülü klasik açıklara GÜVENLİ mi: alg=none reddi,
      # RS256→HS256 key-confusion reddi, exp expiry, imza-kurcalama + pozitif. verify header
      # alg'ini OKUMAZ (koşulsuz HMAC) → alg-confusion yapısal imkânsız. Pozitif-kontrollü.
      - name: JWT güvenlik (alg=none / key-confusion / exp / tamper + pozitif)
        run: |
          cd cpp
          ./build/lk tests/jwt_security.lk

      # FastCGI wire-parse tablo + fuzz — seam (look/fcgi_parse.h). Ağa açık PRE-DISPATCH kod
      # (nginx/Apache→FCGI record veya LOOK_FCGI_BIND). BULUNAN+DÜZELTİLEN BUG: kesik 4-bayt
      # uzunluk alanı → parse_params sonsuz-döngü (worker DoS); progress-guard kilitli. ASan tablo
      # + 200K fuzz + POZİTİF-KONTROL (clamp'siz varyant → ASan heap-overflow).
      - name: FastCGI wire-parse (seam tablo + fuzz + DoS-regresyon)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/fcgi_parse_test.cpp -o /tmp/fcgi_parse_test
          timeout 60 /tmp/fcgi_parse_test
          g++ -std=c++17 -Iinclude -DFCGI_POSCTL -fsanitize=address,undefined \
            -fno-sanitize-recover=all tests/fcgi_parse_test.cpp -o /tmp/fcgi_posctl
          if timeout 30 /tmp/fcgi_posctl; then echo "::error::POSCTL dişsiz"; exit 1; \
          else echo "POSCTL ASan yakaladı (beklenen)"; fi

      # cookie:: güvenli-varsayılan (2026-08 flip) — HttpOnly + SameSite=Lax VARSAYILAN (session::
      # ile hizalı; Secure değil, düz-HTTP dev kırılmasın). Opt-out options assoc'u ile. lk-fcgi
      # --mode http'ye karşı Set-Cookie başlığı doğrulanır. Pozitif-kontrollü (varsayılan kalkarsa RED).
      - name: "cookie:: güvenli-varsayılan flag'leri (runtime)"
        run: |
          cd cpp
          bash tests/cookie_flags_test.sh build/lk-fcgi 7793

      # before_route prefix guard — GÜVENLİK-KRİTİK. Dogfood'un kimlik doğrulaması artık tek
      # before_route + request::path() prefix'i (9 elle require_login → 1). Kırılırsa /admin (dogfood'da
      # /tasks) auth'suz açılır = sessiz yetki atlatması. lk-fcgi --mode http'ye karşı 403/200 + nested
      # doğrular. POZİTİF-KONTROLLÜ: guard'sız varyant /admin=200 (test discriminador — sabote→RED).
      - name: before_route prefix guard (yetki atlatma regresyonu)
        run: |
          cd cpp
          bash tests/middleware_guard_test.sh build/lk-fcgi 7795

      # route::group() — Go/chi tarzı prefix + middleware kalıtımı (name/namespace YOK, bilinçli
      # minimal). İki motorda parity, lk-fcgi --mode http'ye karşı. Kendinden-ayırt-edici: prefix
      # kırılırsa bare /solo açılır (404 değil 200), mw kırılırsa no-token 200 döner → test RED.
      - name: "route::group prefix + middleware kalıtımı (VM+interp parity)"
        run: |
          cd cpp
          bash tests/route_group_test.sh build/lk-fcgi 7715

      # lk fmt — kaynak biçimlendirici (gofmt modeli). Girinti/boşluk kanonikleştirir; token
      # dizisi değişirse İPTAL eder (anlam-koruma). Guard: idempotency + anlam-koruma + --check
      # exit kodları + yorum/çok-satırlı-string koruma. Pozitif-kontrollü (string-içi bozulursa RED).
      - name: lk fmt (idempotent + anlam-koruma + yorum/string)
        run: |
          cd cpp
          bash tests/fmt_test.sh build/lk

  # ── Canlı DB job'u: gerçek MySQL 8 + PostgreSQL 16 servis-container'ları ──────────
  # caching_sha2_password (MySQL 8 VARSAYILAN auth) + native prepared-bind (MySQL
  # COM_STMT_EXECUTE + PG extended-query) — üç KISMİ item'ın "canlı-DSN/nightly" boşluğu.
  # Taze mysql:8 = boş önbellek → ilk bağlantı full-auth (RSA) yolu; bind matrisi gerçek
  # binary protokolü egzersiz eder. Gömülü sürücüler (libmysqlclient/libpq YOK) → yalnız lk.
  db-live:
    name: "Canlı DB — caching_sha2 (MySQL 8) + prepared bind (MySQL 8 + PG 16)"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: lookci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lookci
          POSTGRES_PASSWORD: lookci
          POSTGRES_DB: lookci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U lookci -d lookci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev
      - name: Build lk (Release)
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target look --parallel $(nproc)
      # caching_sha2: root@mysql:8 TLS'siz TCP → taze önbellek → full-auth RSA yolu (sonra fast).
      - name: "caching_sha2_password — gerçek MySQL 8 (full-auth RSA + fast yol)"
        env:
          MYDSN: "mysql://root:rootpw@127.0.0.1:3306/lookci"
          MYUSER: root
          MYHOST: 127.0.0.1
          MYPORT: "3306"
          MYDB: lookci
        run: |
          cd cpp
          bash tests/mysql_caching_sha2_ci.sh ./build/lk
      # native prepared bind matrisi — MySQL COM_STMT_EXECUTE + PG extended-query.
      - name: "Prepared bind matrisi — MySQL 8 + PostgreSQL 16 (native)"
        env:
          MYSQL_DSN: "mysql://root:rootpw@127.0.0.1:3306/lookci"
          PG_DSN: "postgres://lookci:lookci@127.0.0.1:5432/lookci"
        run: |
          cd cpp
          for f in db_bind_mysql db_bind_pg; do
            echo "== $f =="
            out="$(timeout 60 ./build/lk tests/behavioral/$f.lk 2>&1)"; echo "$out"
            echo "$out" | grep -q 'ran='  || { echo "::error::$f erken oldu (ran= yok)"; exit 1; }
            echo "$out" | grep -q '^FAIL' && { echo "::error::$f bind assert kirildi"; exit 1; }
            true
          done
          echo "Native prepared-bind matrisi (MySQL+PG) YESIL."

  # ── PG TLS gerçek-sunucu interop job'u ───────────────────────────────────────────
  # mock (pg_tls_handshake_test) yalnız client verify-kararını ölçer; bu, apt postgres'i
  # initdb ile (TLS-on + TLS-off cluster, CA-imzalı SAN=localhost cert, scram) ayağa kaldırıp
  # GERÇEK SSLRequest→'S'→TLS→startup→SCRAM-auth→SELECT roundtrip'ini uçtan uca kanıtlar.
  pg-tls-live:
    name: "PG TLS gerçek-sunucu interop (SSLRequest→TLS→startup→SCRAM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build + postgres + openssl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev postgresql openssl
      - name: Build lk (Release)
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target look --parallel $(nproc)
      # Vacuous-green guard (Rule-2): harness postgres/openssl yoksa exit 0 ile ATLAR;
      # gerçek PASS satırını zorunlu kıl — atlanırsa job KIRILIR (sessiz-yeşil yok).
      - name: PG TLS gerçek-sunucu interop (6-vaka + pozitif-kontrol)
        run: |
          cd cpp
          out="$(bash tests/pg_tls_realserver_test.sh build/lk 54330 54331)"; echo "$out"
          echo "$out" | grep -q '^PASS: PG TLS' || { echo "::error::PG TLS testi ATLANDI veya kirildi (vacuous-green guard)"; exit 1; }

  # ── Eşzamanlılık hang smoke job'u (worker-pool + fiber) ──────────────────────────
  # c=100 hang regresyonu (acceptor açlığı, D Fix #2) için bounded-concurrency guard'ı: c=50
  # eşzamanlı × 20 keep-alive istek, iki dispatch modunda (pool + fiber), TÜMÜ 200 + sunucu
  # canlı. Pozitif-kontrollü (dead-port + accept-only-hang sunucu → RED). c=100 üst-ucu nightly
  # (yük makine-gürültüsüne duyarlı); c=50 mantık-starvation'ını CI'da güvenilir egzersiz eder.
  concurrency-smoke:
    name: "Eşzamanlılık hang smoke (pool + fiber, c=50)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev python3
      - name: Build lk-fcgi (Release)
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target look-fcgi --parallel $(nproc)
      - name: Concurrency hang smoke (c=50 × 20, pool + fiber)
        run: bash cpp/tests/concurrency_smoke.sh cpp/build/lk-fcgi 50 20
