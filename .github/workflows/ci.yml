name: CI — Build & Regression

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: "Clean Linux build + regression suite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev

      # Temiz bir GCC/Linux ortamında derleme — portability regresyonlarını
      # (ör. eksik <cstdint>) burada yakalar; MSVC'nin transitive include'ları
      # gizleyebildiği sorunlar CI'da ortaya çıkar.
      - name: Build lk + lk-fcgi + lk-cgi (Release)
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          # look-cgi DE derlenir: yalnız look+look-fcgi derlemek look-cgi'yi kör bırakıyordu —
          # Katman 0 (is_reserved_builtin) look-cgi link'ini sessizce kırdı, yalnız 3-target
          # release build yakaladı (kırık lk-cgi = Plesk CGI yolu yayınlanacaktı). 3 target = kapalı.
          cmake --build build --target look --target look-fcgi --target look-cgi --parallel $(nproc)

      # Interpreter regresyon suite — assertion dosyası "OK/FAIL" basar.
      # Herhangi bir FAIL satırı işi kırar.
      - name: Regression suite (interpreter)
        run: |
          cd cpp
          out="$(./build/lk tests/regression_all.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::Regression FAILED"
            exit 1
          fi
          echo "All assertions passed."

      # Kripto known-answer testi — el-yazması SHA-256/HMAC/base64'ü NIST FIPS 180-4 +
      # RFC 4231/4648 vektörlerine pinler. differential yalnız motorları KARŞILAŞTIRIR
      # (üçü de aynı yanlışı verse geçer); bu SPEC'e karşı doğrular. exit 1 ile fail-loud.
      - name: Crypto known-answer vectors
        run: |
          cd cpp
          ./build/lk tests/crypto_vectors.lk

      # RS256 known-answer — crypto_vectors sha/hmac/base64'ü kapsıyordu ama rs256'yı
      # kapsamıyordu (olgunluk denetimi 2026-08-11 boşluğu). Sabit imza (openssl dış
      # oracle, PKCS#1 v1.5 deterministik) + reddetme tarafı (bozuk mesaj/imza). POSIX
      # yolu burada TAM doğrulanır; Windows verify STUB (throw) — bu KAT, Windows NCrypt
      # impl'i geldiğinde onu AYNI imzaya karşı doğrulayacak silahtır.
      - name: RS256 known-answer (verify + reject + deterministik sign)
        run: |
          cd cpp
          ./build/lk tests/rs256_kat.lk

      # date:: DST regresyon — add/sub/diff gün-aritmetiği TAKVİM-tabanlı mı. Eski
      # 86400-saniye yolu DST fall-back'te (25s gün) +1 günü AYNI güne kaydırıyordu
      # (sessiz 1-gün: abonelik/rezervasyon). DST'li TZ ŞART — UTC tek başına görmez.
      - name: date DST (calendar arithmetic, TZ=America/New_York)
        run: |
          cd cpp
          TZ=America/New_York ./build/lk tests/date_dst_test.lk
          TZ=UTC ./build/lk tests/date_dst_test.lk

      # DKIM tag-parser ① KAT — RFC 6376 tag ayirma dogru mu (bh= icindeki h='e carpmasin).
      # Saf parser (look/dkim_tag.h), pozitif kontrollu: eski find() parser'i ①'de bozuk.
      - name: DKIM tag-parser KAT
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/dkim_tag_test.cpp -o /tmp/dkim_tag_test
          /tmp/dkim_tag_test

      # DKIM verify tablo testi — seam (dkim_verify_with_key) + ② çoklu-From FAIL-SAFE.
      # Pozitif kontrol (geçerli imza→TRUE) + iki yön çoklu-From→FALSE. Bir refactor bu
      # fail-safe davranışı bozarsa (find/rfind aynı From'a yaklaşırken) KIRMIZI.
      - name: DKIM verify table (seam + çoklu-From)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/dkim_verify_test.cpp src/dkim.cpp src/dns.cpp \
            -lssl -lcrypto -lresolv -o /tmp/dkim_verify_test
          /tmp/dkim_verify_test

      # SMTP adres parser tablo testi — seam (look/smtp_parse.h) + geçmiş bug'lar (bare
      # adres, <> null-sender, iç içe '<') kilitli. ASan+UBSan: adversarial + 100K girdide
      # OOB/çökme yok. Ağa açık PRE-AUTH kod; bir refactor sağlamlığı bozarsa KIRMIZI.
      - name: SMTP addr parser table (seam + adversarial)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/smtp_parse_test.cpp -o /tmp/smtp_parse_test
          /tmp/smtp_parse_test

      # IMAP parser tablo testi — seam (look/imap_parse.h): parse_command/split_two +
      # mailbox_name_ok GÜVENLİK guard'ı. Belgeli geçmiş bug `INBOX; rm -rf /` KABUL'dü;
      # artık RED (kilitli). ASan+UBSan: adversarial + 100K çökme yok.
      - name: IMAP parser table (seam + mailbox guard)
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/imap_parse_test.cpp -o /tmp/imap_parse_test
          /tmp/imap_parse_test

      # SMTP runtime guard'ları — gerçek sunucu ayağa kaldırılıp ham SMTP konuşulur.
      #  1) smtp_test.sh: adres ayrıştırma + relay + per-IP limit + fd sızıntısı.
      #  2) smtp_slowloris_test.sh: EventLoop idle-timeout POZİTİF KONTROL — idle
      #     bağlantı timeout sonra kapanır, aktif bağlantı kapanmaz, conn_count sızmaz.
      #     (Non-blocking ET soketinde SO_RCVTIMEO çalışmaz → koruma EventLoop katmanında.)
      - name: SMTP runtime (parser + relay + slowloris idle-timeout)
        run: |
          cd cpp
          bash tests/smtp_test.sh build/lk-fcgi 7826
          bash tests/smtp_slowloris_test.sh build/lk-fcgi 7830

      # Motor paritesi — bu guard'lar repoda vardı ama HİÇBİR workflow'da koşmuyordu
      # (olgunluk denetimi 2026-08-11: "guard var, CI'da yok" = regresyon manuel-koşuma
      # bağlı). Şimdi bağlandı. differential = tree-walk/CLI-VM/web-VM 22 kat×3 birebir;
      # closure = 12 vaka parite; recursion = graceful stack-overflow; parallel_db = iki
      # motorda conn-sızıntısı + havuz baskısı. (differential yol-çözme bug'ı düzeltildi:
      # alt-testler $TMP'ye cd ediyordu, göreli build/lk çözülmüyordu.)
      - name: Motor paritesi (differential + closure + recursion + parallel)
        run: |
          cd cpp
          bash tests/differential_test.sh build/lk build/lk-fcgi
          bash tests/closure_semantics_test.sh build/lk
          bash tests/vm_recursion_test.sh build/lk
          bash tests/parallel_db_test.sh build/lk-fcgi

      # HTTP sertleştirme runtime — request smuggling (çift-CL/TE-varyant/obs-fold) +
      # slowloris header-deadline. Testler vardı, CI'da değildi.
      - name: HTTP sertleştirme (smuggling + slowloris)
        run: |
          cd cpp
          bash tests/http_smuggle_test.sh build/lk-fcgi
          bash tests/http_slowloris_test.sh build/lk-fcgi 7622

      # SSE sse::close() fd-sızıntısı — bug-avı bulgusu (957d11e). Sunucu sse::close çağırınca
      # fd/epoll/map istemci TCP-kopana kadar sızıyordu (+ soket kapanmadığı için istemci asılı).
      # fd-sayacı guard'ı (TSan bu fd-yaşam yarışına kör). Pozitif kontrol: fix öncesi fd=base+1.
      - name: SSE sse::close fd-sızıntısı (runtime)
        run: |
          cd cpp
          bash tests/sse_close_test.sh build/lk-fcgi 7768

      # Güvenlik repro'ları — ReDoS/F-01 thread sızıntısı, file-root path-traversal
      # (encoded/çift-encoded), i64 overflow. NOT: msvc_mul_ovf Linux yolunu kilitler;
      # MSVC dalı Windows CI gerektirir (olgunluk denetimi Tema B).
      - name: Güvenlik repro'ları (ReDoS + traversal + i64)
        run: |
          cd cpp
          build/lk tests/repro/regex_leak_check.lk
          build/lk tests/repro/file_root_traversal.lk
          build/lk tests/repro/msvc_mul_ovf.lk

      # docs-conformance — docs'taki her mod::fn çekirdekte (builtin_names) var mı?
      # session::has sınıfını (docs vaat ediyor, çekirdek yok → kullanıcı 500) toplu kapatır.
      # Saf metin karşılaştırması (build yok); allowlist gerekçeli, yeni drift fail eder.
      - name: docs-conformance (docs API ↔ builtin_names)
        run: bash cpp/tests/docs_conformance.sh
