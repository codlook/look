name: CI — Build & Regression

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# a program that uses cookies does not start without LOOK_SECRET (CSRF signing key).
# CI's own test key; test scripts that start servers with env -i pass their own.
env:
  LOOK_SECRET: look-ci-secret-0123456789abcdef0123456789abcdef

jobs:
  build-and-test:
    name: "Clean Linux build + regression suite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev zlib1g-dev libzstd-dev
          # Ubuntu 26.04's static libcrypto also needs libjitterentropy.a (the package does not exist on 24.04)
          if apt-cache show libjitterentropy3-dev >/dev/null 2>&1; then sudo apt-get install -y libjitterentropy3-dev; fi

      # Build in a clean GCC/Linux environment — catches portability regressions
      # (e.g. a missing <cstdint>) here; problems that MSVC's transitive includes
      # can hide show up in CI.
      - name: Build lk + lk-fcgi + lk-cgi (Release)
        timeout-minutes: 10
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          # look-cgi is built TOO: building only look+look-fcgi left look-cgi blind —
          # layer 0 (is_reserved_builtin) silently broke the look-cgi link, and only the 3-target
          # release build caught it (a broken lk-cgi = the Plesk CGI path would have shipped). 3 targets = closed.
          cmake --build build --target look --target look-fcgi --target look-cgi --parallel $(nproc)

      # The memory-safety protections are in the FINISHED binaries (PIE, full RELRO, non-executable stack,
      # stack-protector checks, fortified libc calls). 1.1.5 shipped without most of them and no test noticed.
      - name: Binaries carry their memory-safety protections
        timeout-minutes: 5
        run: bash cpp/tests/binary_hardening_check.sh cpp/build/lk cpp/build/lk-fcgi cpp/build/lk-cgi

      # Regression suite — the assertion file prints "OK/FAIL".
      # Any FAIL line breaks the job.
      - name: Regression suite
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/regression_all.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::Regression FAILED"
            exit 1
          fi
          echo "All assertions passed."

      # stdlib adversarial guard — malformed/boundary/overflow inputs to the
      # previously-unlocked stdlib surface (array boundary, regex ReDoS, template
      # inertness, date parse, timestamp overflow). Any FAIL breaks CI.
      - name: stdlib adversarial guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(env TZ=UTC ./build/lk tests/stdlib_adversarial.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::stdlib adversarial guard FAILED"
            exit 1
          fi
          echo "stdlib adversarial guard passed."

      # VM wide-constant guard — GET_FIELD/SET_FIELD used to truncate the field-name
      # constant index to 8 bits, so in any function with 256+ constants `$obj.field`
      # read/wrote the WRONG key (silent wrong data). Any FAIL breaks CI.
      - name: VM wide-constant field access guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/vm_wide_const_test.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::VM wide-constant guard FAILED"
            exit 1
          fi

      # Struct VM parity guard — the VM never knew struct definitions, so defaults were
      # dropped and unknown-field literals accepted on the VM (CLI + web). Uses no
      # non-builtin module functions (they used to push the CLI onto the tree-walk
      # engine and hide the VM bug). Any FAIL breaks CI.
      - name: Struct VM parity guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/struct_vm_parity_test.lk)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL'; then
            echo "::error::struct VM parity guard FAILED"
            exit 1
          fi

      # typed structs: a field is name + type + default. One rule set
      # (include/look/struct_types.h): type checked at construction and on
      # assignment, zero values, fixed shape, per-instance default arrays.
      - name: Typed struct guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/struct_typed_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::typed struct guard FAILED"
            exit 1
          fi

      # A job handler started from inside a request has its own context (1.0.13).
      - name: Job handler does not share the request
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/job_handler_context_test.sh ./build/lk-fcgi

      # a job handler returns true or false; any other result is logged and the job is not
      # run again (a forgotten return ran it three times); a retry waits.
      - name: Job handler result and retry wait
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/job_handler_result_test.sh ./build/lk-fcgi

      # The job queue itself: an atomic claim across processes (no job run twice), a retry that
      # waits and ends in failed, delayed jobs, recovery of a claimed job, done jobs not taken
      # again, and a cold start with several processes creating the schema at once.
      - name: Job queue (multi-process claim, retries, delays, recovery)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/jobs_test.sh ./build/lk

      # a timer armed and a job handler registered at the top level run on the VM once
      # its setup has succeeded (they stayed on the tree-walk engine while the routes ran on the VM).
      - name: Top-level timers and job handlers on the VM
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/toplevel_callbacks_vm_test.sh ./build/lk-fcgi

      # A top-level variable computed with a plain built-in (max, strtoupper, strlen, ...) was null
      # in routes on the default engine: the VM's setup pass did not connect those functions.
      - name: Built-ins at the top level
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/toplevel_builtins_test.sh ./build/lk-fcgi

      # Generated from the binary's own built-in table: every pure built-in is called at the top
      # level and inside a route; the two results must be equal.
      - name: Built-ins at the top level (generated from the built-in table)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/builtin_toplevel_auto_test.sh ./build/lk ./build/lk-fcgi

      # math::random used the C generator, re-seeded with the current second for every new copy of the standard
      # library: the first requests of each worker got the same number.
      - name: math::random differs between requests
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/random_per_request_test.sh ./build/lk-fcgi

      # a route that calls a module function that does not exist stops the application at
      # startup (it was handed to the tree-walk engine and failed on the first request to reach it).
      - name: A call to a function that does not exist stops startup
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/undefined_function_startup_test.sh ./build/lk ./build/lk-fcgi

      # Every module function is provided by the VM. A program that reaches one the VM does not
      # provide does not start; `lk --vm-report` lists such functions and fails when there is one.
      - name: VM provides every module function
        timeout-minutes: 10
        run: |
          cd cpp
          ./build/lk --vm-report

      # the command line runs only on the VM — a script that does not compile does not
      # run (exit 1, the reason), LOOK_CLI_VM=0 / LOOK_BYTECODE=0 are ignored with a warning, job
      # handlers and timers run on the VM and their output reaches stdout, ws::/sse:: say they
      # belong to a web application, and a line starting with ++ or -- is a statement.
      - name: The command line runs only on the VM
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/cli_vm_only_test.sh ./build/lk

      # On the command line the output of a job handler, a timer callback and a parallel() task
      # reaches stdout; a handler a web route runs does not write into that route's response.
      - name: Callback output reaches stdout on the command line
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/callback_output_cli_test.sh ./build/lk ./build/lk-fcgi

      # A command-line script ends when its last line has run (Go/Rust): timers left are named in a
      # WARN line, timer::wait([ms]) waits for timer::after callbacks, and a web request may not wait.
      - name: A script ends when its last line has run
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/timer_script_end_test.sh ./build/lk ./build/lk-fcgi

      # lk test does what the documentation says: counting, every assert, before_each/after_each,
      # use assert, isolation between tests, setup and parse errors.
      - name: lk test does what the documentation says
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/lk_test_runner_test.sh ./build/lk

      # assert_throws checks the throw wherever it stands in the test (not only as the last
      # statement) and in its module form assert::throws.
      - name: lk test assert_throws in every position
        timeout-minutes: 5
        run: |
          cd cpp
          bash tests/test_runner_test.sh ./build/lk

      # lk repl runs on the VM: state between lines, shown values, errors, :vars.
      - name: lk repl
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/repl_test.sh ./build/lk

      # lk-cgi (the Apache/Plesk CGI path) serves a LOOK application: routes, parameters, JSON,
      # status and headers, 404, a script without routes, errors.
      - name: lk-cgi serves a LOOK application
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/cgi_test.sh ./build/lk-cgi

      # httpoxy: under CGI a Proxy: request header becomes HTTP_PROXY; http:: must not use it.
      - name: No httpoxy under lk-cgi
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/httpoxy_test.sh ./build/lk-cgi

      # A host function value (lk test helpers) travels like any function value: parallel, timer,
      # cache, json, type::of, == — no crash, errors named.
      - name: Host function values at the boundaries
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/native_fn_boundary_test.sh ./build/lk

      # type::of says "function" for a function on the VM (command line and web).
      - name: type::of says function for a function
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/type_of_function_test.sh ./build/lk ./build/lk-fcgi

      # type::of and type::is_* agree for a value of every kind (one fixed, its neighbour forgotten → red).
      - name: type::of and type::is_* agree
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/type_of_is_consistency_test.sh ./build/lk ./build/lk-fcgi

      # An element assignment used as an expression yields the element (1.0.12).
      - name: Element assignment as an expression
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/assign_expr_value_test.lk || true)"
          echo "$out"
          echo "$out" | grep -q "^PASS: an element assignment yields the element" || { echo "::error::assignment expression test FAILED"; exit 1; }

      # ++ and -- on an element or a field, with the meaning they have on a variable; an
      # element assignment used as an expression yields the element (the VM yielded the container).
      - name: Increment and decrement on elements
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/element_step_test.lk || true)"
          echo "$out"
          echo "$out" | grep -q "^PASS: ++ and -- on elements" || { echo "::error::element step test FAILED"; exit 1; }

      # indexing a value that is not an array, a map or a struct is an error, always
      # with the same message; a missing key still gives null.
      - name: Indexing a non-array
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/index_non_array_test.lk || true)"
          echo "$out"
          echo "$out" | grep -q "^PASS: indexing a value that is not an array" || { echo "::error::index test FAILED"; exit 1; }

      # value semantics: assigning, passing or returning an array, map or struct gives
      # the receiver its own value (copy on write); push/pop change their variable only.
      - name: Value semantics guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/value_semantics_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::value semantics guard FAILED"
            exit 1
          fi

      # a large map keeps an index of its keys (include/look/assoc_index.h). Every way of
      # changing a map must give the same answers on a small map (no index) and a large one.
      # The second run uses a build where every indexed lookup is checked against a full scan
      # and aborts on a difference — a new code path that changes a map without keeping its
      # index right fails here.
      - name: Map key index guard
        timeout-minutes: 10
        run: |
          cd cpp
          cmake -S . -B build-assoc-verify -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-DLOOK_ASSOC_INDEX_VERIFY > /dev/null
          cmake --build build-assoc-verify --target look --parallel $(nproc) > /dev/null
          for b in build build-assoc-verify; do
            out="$(./$b/lk tests/assoc_index_test.lk 2>&1)"; rc=$?
            echo "$b: $out"
            if [ $rc != 0 ] || ! echo "$out" | grep -q 'assoc index: all checks passed'; then
              echo "::error::map key index guard FAILED ($b)"
              exit 1
            fi
            out="$(./$b/lk tests/value_semantics_test.lk 2>&1)"; rc=$?
            if [ $rc != 0 ] || echo "$out" | grep -q '^FAIL'; then
              echo "$out"; echo "::error::value semantics with the map index check FAILED ($b)"; exit 1
            fi
          done
          # many worker threads read one shared map for the first time at once (app::set)
          cmake --build build-assoc-verify --target look-fcgi --parallel $(nproc) > /dev/null
          bash tests/shared_map_concurrent_test.sh ./build/lk-fcgi 7931
          bash tests/shared_map_concurrent_test.sh ./build-assoc-verify/lk-fcgi 7932

      # push() / array::push() on a map is an error with its line (it used to add a value without
      # a key: later keys read as null). Every push path: variable, nested, function, expression,
      # array::push in place and copying, web request and web setup.
      - name: push onto a map is an error
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/push_map_error_test.sh ./build/lk ./build/lk-fcgi 7933

      # Every function that takes an array, given an empty, a one-key and an indexed (12-key) map:
      # list functions stop with "takes a list, not a map"; contains/find/any/all/reduce look at
      # values (contains used to search keys too: {"admin": 0} passed a role check); map/filter
      # keep the keys; no result shows the map's internal marker.
      - name: List functions on a map
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/map_functions_test.lk 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q 'map functions: all checks passed' || { echo "::error::map functions FAILED"; exit 1; }

      # Random programs on lists, maps and strings (index/key writes, nested writes, push/pop,
      # copies, array::set, ==, json round trip, foreach, UTF-8 string functions) run on lk and
      # on a small reference model; any difference fails with the shrunk program. Fixed seed;
      # LOOK_COLL_FUZZ_ITERATIONS=N runs longer.
      - name: Collections differential fuzz
        timeout-minutes: 10
        run: |
          cd cpp
          python3 tests/collections_differential_test.py ./build/lk

      # `$s .= x` and `$s = $s . x` append in place, in a function and at top level (they copied
      # the whole string every time: 300k appends took 0.8-1.8 s, now about 10 ms); the operands
      # still see the old value, a copy of the string is not changed.
      - name: Appending to a string is linear
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/concat_in_place_test.lk 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q 'concat in place: all checks passed' || { echo "::error::concat in place FAILED"; exit 1; }

      # A literal 0x / 0b with no digits was 0, and a string holding a whole number over 64 bits
      # became 0 when used as a number ($list["99999999999999999999"] read element 0). Both are
      # errors now; a non-numeric string stays lenient (int("abc") == 0).
      - name: No silent wrong numbers (0x, strings over 64 bits)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/numeric_overflow_test.sh build/lk

      # SIGTERM (systemd stop/restart, a Plesk release switch): the request in progress finishes
      # with "Connection: close", new connections are refused, an idle keep-alive connection does
      # not hold the exit, exit code 0; a second signal stops at once. HTTP and FastCGI.
      - name: Graceful shutdown on SIGTERM
        timeout-minutes: 10
        run: |
          cd cpp
          LOOK_FIBER_DISPATCH=0 bash tests/graceful_shutdown_test.sh ./build/lk-fcgi 7960   # worker per connection (fiber is the default)
          LOOK_FIBER_DISPATCH=1 bash tests/graceful_shutdown_test.sh ./build/lk-fcgi 7965

      # Memory limit (LOOK_MEMORY_LIMIT, automatic by default): one request cannot kill the server.
      # A request over its budget gets 500; at the process limit the biggest request gets 503; the
      # stop cannot be caught; joined strings take their own size; the command line has no default
      # limit. Fiber (the default) and the worker pool.
      - name: One request cannot use up the server's memory
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/memory_budget_test.sh ./build/lk-fcgi 7940
          LOOK_FIBER_DISPATCH=0 bash tests/memory_budget_test.sh ./build/lk-fcgi 7945

      # Fiber dispatch: a long builtin (a 12 MB json::decode) does not hold the other requests of
      # its worker. New connections waiting on a stuck worker's socket are drained by an idle
      # worker; a large json::decode runs on the shared pool, so keep-alive connections on that
      # worker are served too.
      - name: A long builtin does not hold other requests
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/stuck_worker_test.sh ./build/lk-fcgi 7690

      # The web server log names the line (and file) of an uncaught error: route, included
      # file, script without routes, setup.
      - name: Web errors are logged with their line
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/web_error_line_test.sh ./build/lk-fcgi 7934

      # a struct is declared once, at the top level of a file. A second, different
      # definition of the same name is an error at load (same file: parse error; another
      # file: when it is loaded). This also removes the only way to reach a stale field cache.
      - name: Struct is declared once, at the top level
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/struct_declare_once_test.sh ./build/lk

      # a block scopes the variables first assigned in it, at the top level too
      # (the VM used to make them globals there while the tree-walk engine did not).
      - name: Block scope
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/block_scope_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::block scope guard FAILED"
            exit 1
          fi

      # http::stream passes state explicitly (callback($chunk, $state) returns the
      # next state), since a closure can no longer keep it in a captured variable.
      - name: http::stream state
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/http_stream_state_test.sh ./build/lk

      # http:: reads a chunked response as strictly as the server reads a chunked request: a malformed
      # size, chunk data without CRLF or a cut body is an error, never a shorter body.
      - name: "http:: chunked responses are read strictly"
        timeout-minutes: 5
        run: |
          cd cpp
          bash tests/http_client_chunked_test.sh ./build/lk

      # Block scope on the web path: a variable first assigned in a top-level block is not a
      # global, so no route sees it (the command-line case is the step above).
      - name: Block scope on the web path
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/block_scope_web_test.sh build/lk-fcgi

      # transition: calls with the wrong number of arguments, listed by `lk --check`.
      - name: Argument count check (lk --check warnings)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/arg_count_check_test.sh ./build/lk

      # Information only: which published modules, packages and example applications this
      # build would stop from loading. Never fails the job.
      - name: Ecosystem scan (modules, packages, examples — information only)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd cpp
          bash tests/ecosystem_scan.sh ./build/lk

      # a call must give a function the arguments it declares (the
      # VM used to accept too many and too few).
      - name: Argument count
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/arg_count_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::argument count guard FAILED"
            exit 1
          fi

      # closure rule: a closure captures the value and cannot change it. A write to a
      # captured variable is a parse error; a variable that changes after it
      # was captured is a warning from `lk --check`.
      - name: Closure capture rule (refused at load + lk --check warnings)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/capture_check_test.sh ./build/lk

      # the same rule for every function: a function, closure, route handler or a function from
      # `use "file.lk"` cannot change a top-level variable in place (every in-place write the VM has:
      # element/field, compound, ++/--, push, pop) — error at load, web server does not start.
      - name: A function cannot change a variable outside it (refused at load)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/outer_write_test.sh ./build/lk ./build/lk-fcgi

      # inside a function a name cannot be both the outer variable (read) and a new local (assigned):
      # `$n += 1` / `$n = $n + 1` would leave the outer $n unchanged silently — as Python's
      # UnboundLocalError, in any order, across branches and loop turns. Parameters, loop variables
      # and locals updated after they were assigned load as before.
      - name: A function cannot read an outer variable and assign the same name (refused at load)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/outer_read_assign_test.sh ./build/lk ./build/lk-fcgi

      # one spelling for a struct field ("name type [= default]"); the two v1
      # spellings are parse errors that say what to write instead.
      - name: Struct field single form
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/struct_single_form_test.sh ./build/lk

      # A misspelled field type stops the web app at start-up, not when a rare route runs.
      - name: Struct field types checked at start-up
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/struct_type_startup_test.sh ./build/lk-fcgi

      # A struct default array/map was shared by every instance, so one request's data
      # appeared in the next user's new instance. Two requests.
      - name: Struct default isolation (two requests)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/struct_default_isolation_test.sh ./build/lk-fcgi

      # Arrays created at setup (const, top-level, captured by a route or by a stored
      # closure) were shared by every request: one request's in-place write reached the next.
      - name: Request isolation (const, global, captured arrays)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/request_isolation_test.sh ./build/lk-fcgi

      # Handlers that outlive a request (timer, WebSocket message, SSE) ran on a
      # second-level interpreter copy that wrote into the real setup values.
      - name: Realtime isolation (timer, SSE, WebSocket)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/realtime_isolation_test.sh ./build/lk-fcgi

      # A route handler runs once per request, also when it fails (until 1.0.8 an error made
      # the server run the same request again on the other engine: duplicate writes), and an
      # error no longer takes a worker down.
      - name: A failing handler runs once
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/no_double_execution_test.sh ./build/lk-fcgi

      # A timer fires when it is due. One armed while the timer thread was already asleep
      # used to wait for the old deadline (up to 30 seconds).
      - name: Timers fire on time
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/timer_late_test.sh ./build/lk-fcgi

      # a timer armed in a route runs on the VM (its callback like a new request, with
      # the declared globals); the route is no longer placed on the tree-walk engine.
      - name: Timers on the VM
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/timer_vm_test.sh ./build/lk-fcgi

      # A script ends at once. The timer thread's stop used to lose its wake-up now and then and
      # the exit waited up to 30 seconds (about 1 run in 20, also for scripts without timers).
      - name: Scripts end at once
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/timer_exit_test.sh ./build/lk

      # A script starts no thread it does not use. The regex guard's pool of 8 threads used to
      # start in every process (every lk run, every lk-cgi request); now the first regex starts it.
      - name: No idle threads at startup
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/startup_threads_test.sh ./build/lk

      # A run-time error names the file it happened in. An error in an included file used to
      # be reported with the main script's name and the included file's line number.
      - name: Errors name the right file
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/error_location_test.sh ./build/lk

      # an application with a job handler and a draining timer at the top level runs
      # on the VM (each used to send the whole application to the tree-walk engine).
      - name: Job queue on the VM
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/jobs_vm_test.sh ./build/lk-fcgi

      # A job is handled exactly once when several consumers drain the queue at once (the
      # claim of the next job is one atomic statement; this once was a SELECT then an UPDATE).
      - name: Concurrent queue consumers
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/jobs_concurrent_test.sh ./build/lk-fcgi

      # a route handler takes path parameters by name; a handler parameter the route
      # does not have stops the application at startup.
      - name: Route parameters by name
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/route_params_test.sh ./build/lk-fcgi

      # ordinary routes that use ws:: / sse:: run on the VM; a WebSocket message handler
      # runs once per message and its errors are logged.
      - name: WebSocket and SSE functions on the VM
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_sse_vm_test.sh ./build/lk-fcgi

      # string::regex_* take up to 64 KB of input. std::regex recurses once per character and
      # the regex threads had an 8 MB stack: a ~20 KB input killed the whole process (SIGSEGV).
      - name: Long regex inputs do not kill the process
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/regex_long_input_test.sh ./build/lk

      # ...and under a virtual memory limit (shared hosting): 1.0.34 started all 8 regex threads
      # of 256 MB at once and hung under ulimit -v; they now start one at a time as needed.
      - name: Regex under a virtual memory limit
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/regex_memory_limit_test.sh ./build/lk ./build/lk-fcgi

      # A start that cannot get its threads or stacks (a memory limit) says why and exits
      # non-zero: lk-fcgi hung (alive, port never opened), died in std::terminate, or exited 0.
      - name: Startup without enough resources fails with the reason
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/startup_resource_failure_test.sh ./build/lk-fcgi

      # The port opens only when the server can serve: a probe connecting as fast as it can during
      # startup must get an answer on its first accepted connection, and a start that fails for
      # lack of memory must never accept one (http fiber, http per-connection, FastCGI).
      - name: The port opens only when the server can serve
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/listen_when_ready_test.sh ./build/lk-fcgi

      # A list never passes for a map: the map marker is recognised by identity, not by the text
      # "__assoc__" — a JSON body ["__assoc__","role","admin"] used to arrive as role => admin.
      # JSON, form, query and literals stay lists; maps survive threads, JSON and `.=`.
      - name: A list never passes for a map (JSON, form, query input)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/assoc_marker_test.sh ./build/lk ./build/lk-fcgi

      # An error inside a callback (array::map / filter / sort calling a LOOK function) is reported
      # at its own line and file, not at the builtin's call site — as the 1.0.x tree-walk engine did.
      - name: An error inside a callback is reported at its own line
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/callback_error_line_test.sh ./build/lk

      # An uncaught error prints the chain of calls that led to it, innermost first, as the 1.0.x
      # tree-walk engine did; an fn(…) => … closure carries its line.
      - name: An uncaught error prints its call chain
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/stack_trace_test.sh ./build/lk

      # Fixes made in the tree-walk interpreter without a test of their own, pinned on the VM
      # (channel snapshot, callback capture, list + string key, …), plus older repros that were
      # not run anywhere.
      - name: Fixes carried over from the tree-walk interpreter
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/carried_fixes_test.lk 2>&1)"; echo "$out"
          echo "$out" | grep -q '^=== carried fixes done ===$' && ! echo "$out" | grep -q '^FAIL'
          out="$(./build/lk tests/repro/arith_coercion.lk 2>&1)"; echo "$out"
          echo "$out" | grep -q 'arith_coercion done' && ! echo "$out" | grep -q '^FAIL'
          [ "$(./build/lk tests/closure_parallel/np1.lk 2>/dev/null)" = 0 ]
          [ "$(./build/lk tests/closure_parallel/np2.lk 2>/dev/null)" = 123 ]

      # print() writes its whole line at once: printing a local variable leaves it unchanged (it
      # used to become null), and lines printed by parallel() tasks never run into each other.
      - name: print writes its whole line at once
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/print_line_test.sh ./build/lk
          # every built-in, top level / function / route: a local passed in keeps its value
          bash tests/builtin_arg_intact_test.sh ./build/lk ./build/lk-fcgi

      # When a script ends, a parallel() task is named only if it still had work that leaves a
      # trace — not when all it had left was to return after its last send(); never waited for.
      - name: Only tasks with work left are named when a script ends
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/parallel_exit_warning_test.sh ./build/lk 20
          # closing a channel wakes its waiting senders with "send on closed channel"
          bash tests/channel_close_test.sh ./build/lk
          # channel(0) is unbuffered; a deadlock on the command line is an error, never a hang
          bash tests/channel_unbuffered_test.sh ./build/lk ./build/lk-fcgi
          # a request waiting in receive()/send() suspends its fiber, not the worker: other
          # requests on the same worker keep answering (they waited as long as the receive)
          bash tests/channel_fiber_test.sh ./build/lk-fcgi
          # lk --check loads and compiles only — the Plesk extension runs it before moving a site
          bash tests/lk_check_no_side_effects_test.sh ./build/lk

      # error::new() gives a map (a list is never an error value); text inside a printed list,
      # map or struct is quoted, so 3 and "3" never look the same.
      - name: Error values are maps; printed values keep their types
        timeout-minutes: 10
        run: |
          cd cpp
          for t in error_value_test print_nested_test; do
            out="$(./build/lk tests/$t.lk 2>&1)"; echo "$out"
            echo "$out" | grep -q ' done ===$' && ! echo "$out" | grep -q '^FAIL'
          done

      # The deepest expressions and blocks the parser accepts compile on a small stack or fail with
      # the reason, never crash (a 1,000-term `1 + 1 + …` was a SIGSEGV on a 512 KB stack). Binary
      # chains are walked with a loop everywhere; other nesting is checked against the real stack.
      - name: Deep expressions compile on a small stack or say why, never crash
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/deep_expression_compile_test.sh ./build/lk

      # `use "file.lk"` cycles stop the program at load with the chain (Go: import cycle); the main
      # script ran twice for a.lk -> b.lk -> a.lk. A file used by two others still compiles once.
      - name: use cycles are refused at load; a diamond compiles once
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/use_cycle_test.sh ./build/lk ./build/lk-fcgi

      # http:: sent the request with one send(): a slow server let the send timeout expire and
      # the rest of the body was never sent, with no error (8 MB POST: 2.6 MB arrived).
      - name: "http:: sends the whole request body to a slow server"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/http_partial_send_test.sh ./build/lk

      # A Redis reply left half-read (a session over LOOK_REDIS_MAX_BULK) on a connection that
      # stayed open was read by the next request on that thread: one user got another's session.
      # Also checked: a Redis restart never mixes two users' sessions.
      # Session files were written to /tmp with mode 0644, and a look_sess_<id> file another user
      # put there was accepted as a session (user=admin). Now: a 0700 directory owned by the
      # process's user, 0600 files, links not followed, foreign files ignored.
      - name: Session files are private and a foreign file is never a session
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/session_file_security_test.sh ./build/lk-fcgi

      # Session files were never removed (every new visitor whose session got a CSRF token left a
      # file for ever: requests without a cookie could fill the disk), and LOOK_SESSION_TTL was not
      # applied to files. And the default directory is one no other user can create first.
      - name: Expired sessions are removed; the default session directory cannot be taken
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/session_gc_test.sh ./build/lk-fcgi
          bash tests/session_dir_default_test.sh ./build/lk-fcgi
          # CGI: one short-lived process per request — the sweep runs once per interval for all
          # processes (a locked stamp file) and after the response (1.0.39 lost it at exit).
          bash tests/session_gc_cgi_test.sh ./build/lk-cgi
          # CGI never read HTTPS: on an HTTPS site the session cookie went out without Secure.
          bash tests/cgi_https_session_test.sh ./build/lk-cgi

      # csrf:: (signed double-submit cookie, LOOK_SECRET) and request::scheme/host (trusted-proxy
      # rule); also CGI over HTTPS, which sent the session cookie without Secure.
      - name: "csrf:: and request::scheme/host"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/csrf_core_test.sh ./build/lk-fcgi ./build/lk-cgi
          # every unsafe method (PROPFIND, PURGE…) and Sec-Fetch-Site cross-site/same-site (Go CrossOriginProtection)
          bash tests/csrf_gate_test.sh ./build/lk-fcgi 7921
      # multipart parameters read by name in any order; uploads wait in a 0600 temp file
      - name: "multipart uploads — parameter order, private temp file"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/multipart_upload_test.sh ./build/lk-fcgi
          # media type read like Go (quoted/parametered boundary, header case); >1000 parts 413, bad boundary 400
          bash tests/multipart_media_type_test.sh ./build/lk-fcgi 7941
          # no path or symbolic link (dangling ones too) leads outside the root: file::, template::,
          # use; file::store accepts only a file from request::file() in the same request
          bash tests/file_root_escape_test.sh ./build/lk ./build/lk-fcgi 7912

      # Only session ids the server issued are used (session fixation); cookie::set cannot be made
      # to write extra attributes through its path or SameSite value.
      - name: Session fixation and cookie attribute injection
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/session_fixation_test.sh ./build/lk-fcgi
          # a logout is never undone by a session::set running at the same time (file driver)
          bash tests/session_destroy_race_test.sh ./build/lk-fcgi
          # concurrent session::regenerate keeps the data; a logout during it is not undone
          bash tests/session_regenerate_race_test.sh ./build/lk-fcgi "" 7931
          bash tests/proxy_trust_test.sh ./build/lk-fcgi
          # a setting that weakens security writes a [SECURITY] warning at start; defaults write none
          bash tests/weak_settings_test.sh ./build/lk-fcgi

      # FastCGI wrote every request's parameters (client headers as HTTP_*) into the process
      # environment from all threads: getenv crashed, memory grew for good, and one visitor's header
      # showed in the next request's env().
      - name: FastCGI request parameters stay out of the process environment
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/fcgi_request_env_test.sh ./build/lk-fcgi
          # PARAMS limited to 2 MB per request (were unlimited: 200 MB accepted, +315 MB memory)
          bash tests/fcgi_params_limit_test.sh ./build/lk-fcgi
          # a connection that never sends its first request is closed after LOOK_HTTP_IDLE_MS
          bash tests/fcgi_idle_connect_test.sh ./build/lk-fcgi

      # A response is sent whole or its connection closed; clients that never read cannot freeze a
      # worker thread (fibers).
      - name: HTTP responses sent whole; non-reading clients do not freeze workers
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/http_send_guard_test.sh ./build/lk-fcgi
          bash tests/http_response_cap_test.sh ./build/lk-fcgi

      # A hot reload while a request waited (http::get) freed that request's bytecode: SIGSEGV.
      - name: Hot reload never frees a running request's program (fibers and pool)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/hot_reload_inflight_test.sh ./build/lk-fcgi
          # an open WebSocket keeps its program across a reload; new connections get the new one
          bash tests/hot_reload_ws_callback_test.sh ./build/lk-fcgi
          bash tests/fatal_error_isolation_test.sh ./build/lk-fcgi
          bash tests/auth_long_password_test.sh ./build/lk

      # A package module (~/.look/modules) also works after a hot reload: the compiler remembered the loaded
      # modules for the life of the process, so on reload `use package` passed empty and requests returned 500.
      - name: Package modules survive a hot reload
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/package_hot_reload_test.sh build/lk-fcgi

      # Default workers = available CPUs (affinity + cgroup) with fiber dispatch; CPU × 4 with the blocking model.
      # The pool is independent of workers and lazy: db::connect opens one connection, the rest as needed.
      - name: Workers follow usable CPUs; the database pool opens connections as needed
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/worker_pool_defaults_test.sh build/lk-fcgi

      # "Hi {$u["name"]}": the inner double quote ends the string — it reports the error location and the correct spelling ({$u['name']}).
      - name: A quote inside {…} gets an error that shows the right spelling
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/interpolation_quote_message_test.sh build/lk

      # --mode http listened on every interface with no way to narrow it: behind a reverse proxy
      # (Plesk) the site was also open on its own port, and the proxy could be bypassed.
      - name: --bind keeps --mode http on the address given
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/bind_test.sh ./build/lk-fcgi

      - name: Redis sessions never reach another user's request
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/redis_session_crossing_test.sh ./build/lk-fcgi

      # The close callback of a WebSocket runs when the client goes away, also without a
      # close frame (dropped connection); not when the server closes the connection itself.
      - name: WebSocket close callback (dropped client)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_close_callback_test.sh ./build/lk-fcgi

      # A WebSocket callback sees its own handshake request (v1 had no web context there and
      # request::get killed the process; this version ran the callback with an empty request).
      - name: WebSocket callbacks read their handshake request
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_callback_context_test.sh ./build/lk-fcgi

      # A WebSocket / SSE route sees the request's headers and cookies (a session can authenticate
      # it); a browser handshake from another site is still refused.
      - name: WebSocket and SSE routes see headers and cookies; cross-site WebSockets refused
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_cookie_origin_test.sh ./build/lk-fcgi

      # Capacity regressions were found only by a hand-run 700,000-connection benchmark: memory
      # per open WebSocket doubled (1.0.34), and fiber stacks were mapped anew for every connection.
      - name: WebSocket capacity — memory per connection and fiber stack reuse
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_capacity_guard_test.sh ./build/lk-fcgi

      # The stacks of finished connections are kept for reuse; their memory stayed held for good after
      # a storm (20 MB after 1,000 connections, up to 384 MiB), unseen by the memory budget — with a
      # container limit the kernel killed the server (measured: 160 MiB container, exit 137).
      - name: Fiber stack cache gives its memory back (idle, and at once under the memory budget)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/fiber_stack_cache_trim_test.sh ./build/lk-fcgi

      # The messages of one WebSocket ran on different pool threads at the same time and could
      # finish out of order; the close callback was skipped when a send to a departed client failed.
      - name: WebSocket messages handled in order; close callback after them
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_message_order_test.sh ./build/lk-fcgi
          bash tests/ws_on_reregister_test.sh ./build/lk-fcgi
          bash tests/ws_dos_guard_test.sh ./build/lk-fcgi
          # same-origin rule with IPv6 / letter case; handshakes without a valid key are 400
          bash tests/ws_handshake_check_test.sh ./build/lk-fcgi
          python3 tests/ws_backpressure_portable_test.py ./build/lk-fcgi 7795

      # Binary WebSocket messages: ws::send_binary / ws::broadcast_binary send a binary frame, the
      # handler is told a message is binary (one-parameter handlers unchanged), ws::send and
      # ws::broadcast refuse bytes that are not UTF-8 (a browser closes the connection on them),
      # a message in parts keeps its type, over 16 MB closes the connection as for text.
      - name: WebSocket binary messages
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_binary_test.sh ./build/lk-fcgi 7748

      # setup data is shared with every request instead of being copied for it; a write
      # makes the copy. 1200 concurrent requests must each see their own writes and nothing else.
      - name: Shared setup data under concurrent requests
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/shared_setup_concurrency_test.sh ./build/lk-fcgi

      # a function that changes a parameter and never returns it is reported — an error
      # under `lk --check`, a warning at load (CLI, web startup, files loaded with `use`).
      - name: Parameter-write check
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/param_write_check_test.sh ./build/lk ./build/lk-fcgi

      # bare push($list, $x) changes the variable it is given: deprecated in favour of
      # $list = array::push($list, $x). One warning per file (--check and at load); push still works.
      - name: Bare push() is reported once per file
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/push_deprecated_test.sh ./build/lk

      # bare pop($list) changes its variable and array::pop($list) removes nothing: both deprecated
      # in favour of $list[-1] and $list = array::slice($list, 0, -1). One warning per file per kind.
      - name: Bare pop() and array::pop() are reported once per file
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/pop_deprecated_test.sh ./build/lk

      # lk fix rewrites push/pop/array::pop by source ranges (comments and other lines kept), reports
      # what it cannot rewrite (exit 1), is idempotent; --check writes nothing; the output is the same.
      - name: lk fix rewrites push, pop and array::pop
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/lk_fix_test.sh ./build/lk

      # $l = array::push($l, $x) / $l = array::slice($l, 0, -1) skip the module check in place: without
      # `use array` they warn (lk --check and at run time, once per place); a later release errors.
      - name: "In-place array:: without use array is reported"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/use_array_missing_test.sh ./build/lk

      # string::random reduced a random byte with `% 36`: the first four characters of its
      # alphabet came out about 14% more often. Every character is equally likely now.
      - name: string::random is uniform
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/string_random_uniform_test.lk || true)"
          echo "$out"
          echo "$out" | grep -q "^PASS: string::random is uniform" || { echo "::error::string::random distribution test FAILED"; exit 1; }

      # The WebSocket / SSE connection limit refuses the next connection with 503. It used to raise
      # an error nothing caught: one connection over the limit ended the whole server.
      - name: No built-in connection limit; a full limit never stops the server
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/connection_limit_test.sh ./build/lk-fcgi

      # select() cannot take a descriptor above 1023 (FD_SET writes out of bounds). With thousands
      # of open connections every later socket is above that.
      - name: No select() outside Windows-only code
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/no_select_test.sh

      # A test that changes directory and runs a relative ./build/lk does not find it: this
      # broke CI three times (run locally with absolute paths, it never showed).
      - name: Test scripts run their binary arguments by an absolute path
        timeout-minutes: 10
        run: bash cpp/tests/test_path_guard.sh

      # A WebSocket / SSE connection callback has no response to carry an error: if the log does
      # not have it either, the handler fails without a trace.
      - name: Connection callback errors are logged
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/callback_error_log_test.sh ./build/lk-fcgi

      # Open connections — idle, slow, or kept open by a browser — must not make other clients
      # wait (up to 1.0.19 a few of them stalled every other client for 30 s).
      - name: Open connections do not make other clients wait
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/idle_connections_test.sh ./build/lk-fcgi
          bash tests/fiber_stack_depth_test.sh ./build/lk-fcgi

      # Dropping a deeply nested value (1M arrays, structs or closures inside each other) must not
      # overflow the C++ stack: until now one such request killed the whole server.
      - name: Deeply nested values are released without a crash
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/value_release_test.sh ./build/lk ./build/lk-fcgi
          bash tests/value_nesting_test.sh ./build/lk ./build/lk-fcgi
          bash tests/call_depth_test.sh ./build/lk ./build/lk-fcgi
          bash tests/concurrent_recursion_memory_test.sh ./build/lk-fcgi

      # Concurrent writers to one SQLite database: until 1.0.20 some of them lost their turn,
      # waited past the busy timeout and got a 500 "database is locked" (the row was not written).
      - name: Concurrent SQLite writers are not refused
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/sqlite_concurrent_writers_test.sh ./build/lk-fcgi

      # Each SQLite connection keeps its prepared statements; the cache must never change a result
      # or keep a read open: ALTER on the same connection and from another process, a checkpoint
      # after thousands of cached reads, errors, more statements than the cache holds.
      - name: "SQLite statements prepared once per connection, never a wrong result"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/sqlite_stmt_cache_test.sh ./build/lk ./build/lk-fcgi

      # A connection that comes back goes straight to the request that has waited longest. It used
      # to go on the free list, where a newly arriving request could take it first; the woken one
      # went back to the end of the queue (p99 270 ms at c=1000 on MySQL).
      - name: "Requests waiting for a pooled database connection are served in order"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_pool_fairness_test.sh ./build/lk-fcgi

      # After a reply the client could not read to its end (fake MySQL and PostgreSQL servers send
      # one), the next queries must get their own results, not the old reply's rest.
      - name: "No result shifts after a refused MySQL / PostgreSQL reply"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_malformed_desync_test.sh ./build/lk
          # a server asking for 2^31 SCRAM iterations is refused at once (was minutes of PBKDF2)
          bash tests/pg_scram_iterations_test.sh ./build/lk
          # MySQL statement cache behind a multiplexer: 1243 → prepared again, run once (both paths)
          bash tests/mysql_stmt_1243_test.sh ./build/lk
          # a connection lost after a query was sent is an error, never a silent second INSERT
          bash tests/db_retry_test.sh ./build/lk
          # out-of-order / early / flooding PostgreSQL replies are handled without a crash
          bash tests/db_stateful_test.sh ./build/lk

      # Long CPU work (a LOOK loop, deep calls, password hashing) must hold only its own request:
      # up to 1.0.24 LOOK code never gave up its turn under fibers (0.7–1 s waits, 32 s on the
      # interpreter).
      - name: Long CPU work does not hold other requests
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/cpu_turn_test.sh ./build/lk-fcgi

      # Since 1.0.25 a request can give up its turn at any loop turn or call, not only while it
      # waits. LOOK_TEST_PREEMPT=1 (tests only) gives up the turn at EVERY such point, so state
      # that wrongly lives per thread crosses between requests on the first try instead of once
      # in a while (shown: the 1.0.24 bug put back passes 960/960 normally, crashes with this).
      - name: Fiber tests with a turn given up at every point
        timeout-minutes: 10
        env:
          LOOK_TEST_PREEMPT: "1"
        run: |
          cd cpp
          for t in fiber_request_isolation request_isolation struct_default_isolation realtime_isolation \
                   jobs_concurrent sqlite_concurrent_writers db_wait no_double_execution job_handler_context \
                   ws_close_callback ws_callback_context; do
            echo "== $t"; bash tests/${t}_test.sh ./build/lk-fcgi || exit 1
          done

      # With fibers one thread runs many requests and switches between them while one waits.
      # Per-request data must never reach another request across such a switch.
      - name: Suspended requests keep their own data
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/fiber_request_isolation_test.sh ./build/lk-fcgi
          LOOK_FIBER_DISPATCH=0 bash tests/sqlite_concurrent_writers_test.sh ./build/lk-fcgi

      # With fibers a request started while another one was suspended on the same thread
      # counted as nested and never returned its DB connection: the pool ran out and
      # concurrent requests hung without a response.
      - name: Requests on fibers return their DB connection
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/fiber_pool_release_test.sh ./build/lk-fcgi

      # A request that ends inside an open transaction: rolled back, not handed to the next request
      # (which committed the failed work); setup's top-level query no longer keeps a connection.
      - name: Open transaction rolled back at request end; setup returns its connection
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_open_transaction_release_test.sh ./build/lk-fcgi ./build/lk

      # A database query that waits (a lock, a slow statement, a silent server) must hold only
      # its own request. In 1.0.20–1.0.21 SQLite/PostgreSQL/MySQL-over-TLS queries held the whole
      # fiber thread, and every request waited for a pool connection even without using one.
      - name: A waiting database query does not hold other requests
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_wait_test.sh ./build/lk-fcgi

      # An included file the VM cannot compile used to be dropped silently: "compile OK" and
      # 500 "Undefined variable" for every route that called one of its functions.
      - name: Included file the VM cannot compile
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/include_compile_failure_test.sh ./build/lk-fcgi

      # The top level of a web application runs once at startup: the VM's
      # setup pass replays the first pass instead of calling module functions again.
      - name: Top-level code runs once at startup
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/setup_once_test.sh ./build/lk-fcgi

      # Single quotes are raw + an undefined bare name is an error.
      # The run must reach its last line: a crash that prints no FAIL must not pass.
      - name: Raw string + bare name guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/raw_string_bare_name_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::raw string + bare name guard FAILED"
            exit 1
          fi

      # Argument count / parameter index are 8-bit: past 255 they wrapped silently on the VM.
      - name: VM operand limits
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/vm_operand_limits_test.sh ./build/lk

      # No bare narrowing casts in the compiler: every value that goes into an 8/16-bit
      # operand passes through a checked helper (a value that does not fit is an error).
      - name: No unchecked narrowing in the compiler
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/no_unchecked_narrowing.sh
      # The reading side: bytecode operands are combined only through Instruction::bx /
      # bx_lohi / builtin_index. When the operands widened to 16 bits, a hand-made shift in the
      # route scanner would have read the wrong constant without any error.
      - name: No hand-made bytecode operand decoding
        timeout-minutes: 10
        run: bash cpp/tests/no_raw_operand_decode.sh
      # While a fiber waits for the database, Redis, SMTP or HTTP, the worker thread serves other
      # requests: no poll with a timeout and no blocking read in the clients' fiber paths (a 1 ms
      # poll cost ~15% on database load; blocking Redis reads halved session throughput). DNS,
      # connect, the TLS handshake and sends go through look/fiber_net.h for the same reason.
      - name: Network clients never block the worker thread in a fiber
        timeout-minutes: 10
        run: bash cpp/tests/fiber_blocking_io_guard.sh
      # A thread variable written before a wait and read after it can belong to another request
      # once the thread ran other fibers meanwhile (a user received another user's session).
      # Each thread_local states why it is safe ("fiber-ok: …").
      - name: Every thread_local states why it is safe with fibers
        timeout-minutes: 10
        run: bash cpp/tests/thread_local_guard.sh
      # Register reuse — one function far past the old 72-route / 63-call ceiling, plus
      # more than 256 closures. A compile failure is an error, not a fallback.
      - name: Register reuse guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/register_reuse_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::register reuse guard FAILED"
            exit 1
          fi

      # A merge that duplicates a CI step must not pass silently.
      - name: No duplicated CI steps
        timeout-minutes: 10
        run: bash cpp/tests/ci_no_duplicate_steps.sh

      # One source for the version number; docs link to unversioned download names.
      - name: Version has a single source
        timeout-minutes: 10
        run: bash cpp/tests/version_single_source.sh

      # Everything the runtime shows a user is English (messages, logs, CLI output).
      - name: No Turkish text in runtime strings
        timeout-minutes: 10
        run: bash cpp/tests/no_turkish_user_strings.sh

      # A double-quoted render_string template and a value interpolated into SQL may not
      # appear in any documentation file.
      - name: No unsafe examples in the documentation
        timeout-minutes: 10
        run: bash cpp/tests/docs_no_unsafe_examples.sh

      # The measurements are published twice (BENCHMARK.md and the website's benchmarks page);
      # both are edited by hand, so the page could keep numbers the record no longer holds.
      - name: The benchmarks page shows the numbers of BENCHMARK.md
        timeout-minutes: 5
        run: python3 cpp/tests/benchmark_page_sync_check.py BENCHMARK.md docs/look.codlook.com/benchmarks.html

      # JSON error bodies carry "error" (with "hata" beside it for 1.x); 'use timer' and
      # other built-in namespaces explain themselves instead of suggesting an install.
      - name: Error bodies and module messages
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/error_body_test.sh ./build/lk ./build/lk-fcgi
          # a failing route's 500 carries nothing from the error (debug, JSON, pool); no DSN password in the log
          bash tests/error_leak_test.sh ./build/lk-fcgi 7906

      # A comparison operator inside a quoted value must not split a template condition.
      - name: Template condition guard
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(./build/lk tests/template_cond_test.lk || true)"
          echo "$out"
          if echo "$out" | grep -q '^FAIL' || ! echo "$out" | grep -q 'guard done ==='; then
            echo "::error::template condition guard FAILED"
            exit 1
          fi

      # Crypto known-answer test — pins the hand-written SHA-256/HMAC/base64 to the NIST FIPS 180-4 +
      # RFC 4231/4648 vectors. The differential columns COMPARE engines
      # (it passes even if both give the same wrong answer); this verifies against the SPEC. Fails loudly with exit 1.
      - name: Crypto known-answer vectors
        timeout-minutes: 10
        run: |
          cd cpp
          ./build/lk tests/crypto_vectors.lk

      # `$a = array::push($a, v)` appends in place (it used to copy the whole array on every call: 100k
      # appends ~60 s). Results and errors identical to the copying version; pins the "a function cannot
      # change the caller's local" assumption — it breaks if the language changes.
      - name: array::push assigned to its own variable appends in place (same results)
        timeout-minutes: 10
        run: |
          cd cpp
          ./build/lk tests/array_push_assign.lk

      # RS256 known-answer — crypto_vectors covered sha/hmac/base64 but did not cover rs256
      # (a gap found in the maturity audit of 2026-08-11). A fixed signature (openssl as external
      # oracle, PKCS#1 v1.5 deterministic) + the rejecting side (corrupt message/signature). The POSIX
      # path is verified FULLY here; Windows verify is a STUB (throw) — this KAT is the weapon that will verify the Windows NCrypt
      # implementation against the SAME signature when it arrives.
      - name: RS256 known-answer (verify + reject + deterministik sign)
        timeout-minutes: 10
        run: |
          cd cpp
          ./build/lk tests/rs256_kat.lk

      # date:: DST regression — is add/sub/diff day arithmetic CALENDAR-based. The old
      # 86400-second path shifted +1 day to the SAME day on a DST fall-back (25-hour day)
      # (silent 1-day error: subscription/reservation). A TZ with DST is REQUIRED — UTC alone does not see it.
      - name: date DST (calendar arithmetic, TZ=America/New_York)
        timeout-minutes: 10
        run: |
          cd cpp
          TZ=America/New_York ./build/lk tests/date_dst_test.lk
          TZ=UTC ./build/lk tests/date_dst_test.lk

      # DKIM tag-parser (1) KAT — is RFC 6376 tag splitting correct (h= inside bh= must not collide).
      # Pure parser (look/dkim_tag.h), with a positive control: the old find() parser is broken at (1).
      - name: DKIM tag-parser KAT
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/dkim_tag_test.cpp -o /tmp/dkim_tag_test
          /tmp/dkim_tag_test

      # DKIM verify table test — seam (dkim_verify_with_key) + (2) multiple-From FAIL-SAFE.
      # Positive control (valid signature→TRUE) + both directions multiple-From→FALSE. RED if a refactor breaks this
      # fail-safe behaviour (find/rfind approaching the same From).
      - name: DKIM verify table (seam + multiple From)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/dkim_verify_test.cpp src/dkim.cpp src/dns.cpp \
            -lssl -lcrypto -lresolv -o /tmp/dkim_verify_test
          /tmp/dkim_verify_test

      # SMTP address parser table test — seam (look/smtp_parse.h) + past bugs (bare
      # address, <> null-sender, nested '<') locked. ASan+UBSan: adversarial + 100K inputs with no
      # OOB/crash. Network-facing PRE-AUTH code; RED if a refactor breaks robustness.
      - name: SMTP addr parser table (seam + adversarial)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/smtp_parse_test.cpp -o /tmp/smtp_parse_test
          /tmp/smtp_parse_test

      # IMAP parser table test — seam (look/imap_parse.h): parse_command/split_two +
      # the mailbox_name_ok SECURITY guard. The documented past bug `INBOX; rm -rf /` was ACCEPTED;
      # now REJECTED (locked). ASan+UBSan: adversarial + 100K with no crash.
      - name: IMAP parser table (seam + mailbox guard)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/imap_parse_test.cpp -o /tmp/imap_parse_test
          /tmp/imap_parse_test

      # SMTP runtime guards — a real server is brought up and raw SMTP is spoken.
      #  1) smtp_test.sh: address parsing + relay + per-IP limit + fd leak.
      #  2) smtp_slowloris_test.sh: EventLoop idle-timeout POSITIVE CONTROL — an idle
      #     connection closes after the timeout, an active one does not, conn_count does not leak.
      #     (SO_RCVTIMEO does not work on a non-blocking ET socket → the protection lives in the EventLoop layer.)
      #  3) smtp_late_reply_test.sh: a delivery reply returning late from a worker is not written to
      #     ANOTHER connection that got the same fd number. The worker is held not by DNS but by
      #     a half-finished STARTTLS handshake (deterministic).
      - name: SMTP runtime (parser + relay + slowloris idle-timeout)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/smtp_test.sh build/lk-fcgi 7826
          bash tests/smtp_slowloris_test.sh build/lk-fcgi 7830
          bash tests/smtp_late_reply_test.sh build/lk-fcgi 7834
          bash tests/smtp_pipelining_test.sh build/lk-fcgi 7841
          bash tests/mail_capabilities_test.sh build/lk-fcgi 7860
          # TLS 1.3: the first command right behind the client's Finished must not replace the session
          # tickets still waiting to be written (a "bad record mac", the session dropped)
          bash tests/smtp_starttls_load_test.sh build/lk-fcgi 7870
          # mail::send to a remote SMTP server: TLS before the login, an untrusted or wrongly
          # named certificate refused, no fall back to plain text, a refused login reported
          # without the password
          bash tests/smtp_client_tls_test.sh build/lk 7880
          # IMAP: login required, mailbox names checked (no traversal), literal size limit
          bash tests/imap_test.sh build/lk-fcgi 7157

      # Engine parity — these guards existed in the repo but ran in NO workflow
      # (maturity audit 2026-08-11: "guard exists, not in CI" = a regression depends on a
      # manual run). Wired up now. differential = CLI-VM/web-VM 22 categories ×2 identical + golden;
      # closure = 12-case parity; recursion = graceful stack-overflow; parallel_db = connection leak
      # on web + pool pressure. (A differential path-resolution bug was fixed:
      # the sub-tests cd'd into $TMP, so the relative build/lk did not resolve.)
      - name: Motor paritesi (differential + closure + recursion + parallel)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/differential_test.sh build/lk build/lk-fcgi
          bash tests/closure_semantics_test.sh build/lk
          bash tests/vm_recursion_test.sh build/lk
          bash tests/parallel_db_test.sh build/lk-fcgi
          bash tests/finally_ret_test.sh build/lk   # finally return/break/continue (expected lines)
          bash tests/args_test.sh build/lk          # args() CLI arguments
          # Every LOOK example in the public docs must parse (`lk --check`). A clean-room dogfood
          # found the first example failed to parse and route snippets used a `:id` form that
          # 404s — none caught by any guard. This closes that class. See docs_examples_check.py.
          python3 tests/docs_examples_check.py build/lk ../docs/look.codlook.com/docs.html ../docs/look.codlook.com/index.html
          bash tests/route_param_decode.sh build/lk-fcgi   # path params URL-decoded

      # HTTP hardening runtime — request smuggling (double-CL/TE-variant/obs-fold) +
      # slowloris header-deadline. The tests existed but were not in CI.
      - name: HTTP hardening (smuggling + slowloris)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/http_smuggle_test.sh build/lk-fcgi
          bash tests/http_slowloris_test.sh build/lk-fcgi 7622
          # pipelined requests answered in order; unterminated chunked trailer 400; linear header scan
          bash tests/http_pipelining_test.sh build/lk-fcgi
          # RFC 9112 boundary table (Go net/http as the reference; fiber + pool); rejected requests get a status
          bash tests/http_rfc9112_test.sh build/lk-fcgi 7796

      # host[:port] parsing (Go net/url model) for DSN, Redis URL, http:: URL, --port, *_PORT
      - name: "host:port parsing — table + http:: URLs (userinfo, query without a path, IPv6)"
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/host_port_test.cpp -o /tmp/host_port_test
          /tmp/host_port_test
          bash tests/http_client_url_test.sh ./build/lk 7797

      # SSE sse::close() fd leak — found by a bug hunt (957d11e). When the server called sse::close,
      # the fd/epoll/map leaked until the client's TCP dropped (+ the client hung because the socket was not closed).
      # fd-counter guard (TSan is blind to this fd-lifetime race). Positive control: before the fix fd=base+1.
      - name: SSE sse::close fd leak (runtime)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/sse_close_test.sh build/lk-fcgi 7768

      # WS close + fd leak — functional (no TSan), raw-socket handshake (python3 stdlib).
      # handshake 101 → echo → client close-frame → server close + fd freed + abrupt-disconnect
      # regression. WS EWOULDBLOCK (slow-client write-drop) is out of scope (separate load test).
      - name: WS close fd leak (runtime)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/ws_close_test.sh build/lk-fcgi 7769

      # Security repros — ReDoS/F-01 thread leak, file-root path-traversal
      # (encoded/double-encoded), i64 overflow. NOTE: msvc_mul_ovf locks the Linux path;
      # the MSVC branch needs Windows CI (maturity audit theme B).
      - name: Security repros (ReDoS + traversal + i64)
        timeout-minutes: 10
        run: |
          cd cpp
          build/lk tests/repro/regex_leak_check.lk
          build/lk tests/repro/file_root_traversal.lk
          build/lk tests/repro/msvc_mul_ovf.lk
          # exact int/float comparison; abs(INT64_MIN), int(1e19), floor(1e300) defined (were UB)
          bash tests/numeric_edges_test.sh build/lk
          # json::decode / request::json: Go encoding/json's verdict on 64 inputs; 100k keys linear
          bash tests/json_strict_test.sh build/lk

      # Behavioural .lk tests — embedded SQLite / in-process (NO external server). These
      # items used to be "TESTED but outside CI" (they needed an env-DSN/live DB); with the SQLite
      # backend + an in-process thread the core behaviour is PROVEN in CI. db:: CRUD+tx,
      # jobs:: lifecycle+retry, parallel() fan-out+isolation, prepared bind matrix.
      # (mail:: needs an external HTTP provider → outside CI; the MySQL/PG wire dialect is a separate live-DSN check.)
      - name: Behavioral (db/jobs/parallel/prepared, SQLite)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/behavioral_test.sh build/lk

      # Template render golden — a 38-section matrix of template constructs must render byte for
      # byte as the engine did in release abb5e2e (before the parsed-template cache and the render
      # rewrite). Speed numbers say nothing about correctness; this does. Fault injection: removing
      # the HTML escape makes it fail.
      - name: Template render golden (byte-identical)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/template_golden_test.sh ./build/lk

      # lk-cgi --version prints the build (the release check reads its stamp), but not under CGI:
      # a web server may pass a query string without "=" as an argument ("?--version").
      - name: lk-cgi --version outside CGI only
        timeout-minutes: 10
        run: |
          cd cpp
          v="$(./build/lk-cgi --version)"; echo "$v"
          [[ "$v" == "LOOK "*"("*", linux/"* ]] || { echo "::error::lk-cgi --version: '$v'"; exit 1; }
          out="$(GATEWAY_INTERFACE=CGI/1.1 ./build/lk-cgi --version 2>&1 || true)"
          [[ "$out" != "LOOK "* ]] || { echo "::error::lk-cgi printed its version under CGI"; exit 1; }

      # Env-dependent test contract — positive control. A test whose environment is missing
      # SKIPs locally (so a local red always means a real failure) but FAILs in CI (a missing
      # DSN/secret in CI is a configuration error and must not turn into a silent green, the
      # class release-consistency once had). If CI=true detection ever breaks, this step goes
      # red. The SKIP line must not contain "ran=", so the existing ran= guards still catch it.
      - name: Env-dependent test contract (SKIP locally, FAIL in CI)
        timeout-minutes: 10
        run: |
          cd cpp
          UNSET="-u MYSQL_DSN -u PG_DSN -u BT_DIR -u LOOK_FILE_ROOT -u LOOK_TEST_DSN"
          for t in behavioral/db_bind_mysql behavioral/db_bind_pg behavioral/file_ops repro/db_native_bind_matrix; do
            if env $UNSET CI=true ./build/lk tests/$t.lk > /tmp/ci_branch.txt 2>&1; then
              echo "::error::$t: empty env in CI did NOT fail (would be a silent green)"; cat /tmp/ci_branch.txt; exit 1
            fi
            grep -q "FAIL harness" /tmp/ci_branch.txt \
              || { echo "::error::$t: CI branch failed without the harness message"; cat /tmp/ci_branch.txt; exit 1; }
            out="$(env -u CI $UNSET ./build/lk tests/$t.lk 2>&1)" \
              || { echo "::error::$t: local branch did not exit 0"; echo "$out"; exit 1; }
            echo "$out" | grep -q "^SKIP:" || { echo "::error::$t: local branch did not SKIP"; echo "$out"; exit 1; }
            if echo "$out" | grep -q "ran="; then echo "::error::$t: SKIP output contains ran="; exit 1; fi
            echo "  OK $t (CI -> FAIL, local -> SKIP)"
          done

      # PG DSN TLS decision table test — seam (look/db_dsn.h). The sslmode/tls→(tls,verify) logic
      # is locked without a network; the verify-ca silent-plaintext regression (558d735) is POSITIVE-CONTROLLED
      # (if the verify-ca branch is deleted, the verify-ca case gets tls=false → FAIL). The real TLS-handshake
      # matrix (db_tls/, Docker+cert) stays separate/nightly — this covers only the parse axis.
      - name: PG DSN TLS-karar tablosu (seam + verify-ca regresyonu)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/pg_dsn_test.cpp -o /tmp/pg_dsn_test
          /tmp/pg_dsn_test

      # PostgreSQL INSERT id: the target table, the user's own RETURNING, the RETURNING added
      # (look/pg_insert.h). The live behaviour runs against postgres:16 in the db-live job.
      - name: PostgreSQL INSERT id — SQL table test
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/pg_insert_test.cpp -o /tmp/pg_insert_test
          /tmp/pg_insert_test

      # MySQL/Redis DSN TLS decision — seam (look/db_dsn.h). Difference from PG: verify=false is the DEFAULT
      # (the DB cert is self-signed; wire encryption is the goal). The network-free table locks the current decision; RED if
      # the default ever changes (breaking decision). POSITIVE-CONTROLLED.
      - name: MySQL/Redis DSN TLS-karar (seam tablosu)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/mysql_redis_dsn_test.cpp -o /tmp/mrdsn
          /tmp/mrdsn

      # LOOK_DB_REQUIRE_TLS refuse-plaintext decision table — seam (look/db_dsn.h).
      # Remote plaintext REFUSED / loopback+unix ALLOWED / ?insecure_plaintext opt-out. Network-free,
      # POSITIVE-CONTROLLED (RED if the loopback branch or the opt-out is deleted).
      - name: DB require-TLS karar (seam tablosu)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/db_require_tls_test.cpp -o /tmp/drt
          /tmp/drt

      # MySQL multi-packet joining — seam (look/mysql_wire_parse.h). read_packet must join the 0xFFFFFF
      # continuation packets (otherwise a pooled connection returns WRONG DATA for payloads of 16MB+).
      # The reader is a memory buffer → NO live MySQL. cap/0-terminator/broken-stream POSITIVE-CONTROLLED.
      - name: MySQL multi-packet reassembly (seam table)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/mysql_reassemble_test.cpp -o /tmp/mra
          /tmp/mra

      # SHA-256 / HMAC / PBKDF2 RFC known-answer — seam (look/crypto_sha256.h). This trio
      # feeds JWT(HS256)/DKIM/session/auth; "pin to the SPEC, not to its own output": NIST SHA-256
      # + RFC 4231 HMAC + RFC 7914 PBKDF2 vectors. POSITIVE-CONTROLLED. NO new builtin.
      - name: SHA-256/HMAC/PBKDF2 RFC-KAT (seam)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/crypto_sha256_test.cpp -o /tmp/csha
          /tmp/csha

      # PG SCRAM crypto agreement — are the REAL PostgresClient::sha256/hmac/pbkdf2 (postgres_client.cpp)
      # pinned to the same RFC vectors? This trio now DELEGATES to look::crypto_sha256.h through an array<32>↔vector
      # adapter (the parallel copy was merged); the test is a regression guard: if the adapter link
      # breaks / the single-block path drifts, the vectors do not match → RED. Links postgres_client.cpp + OpenSSL.
      - name: PG SCRAM crypto agreement RFC-KAT (seam)
        timeout-minutes: 10
        run: |
          cd cpp
          # fiber_posix + logger: PG reads suspend the fiber while waiting (fiber_io.h)
          g++ -std=c++17 -Iinclude tests/pg_scram_crypto_kat.cpp src/postgres_client.cpp \
              src/fiber_posix.cpp src/mem_budget.cpp src/logger.cpp -lssl -lcrypto -lpthread -o /tmp/pgkat
          /tmp/pgkat

      # PG TLS REAL handshake — mock TLS PG server (python ssl, self-signed cert), NO Docker.
      # verify-full REFUSES an untrusted cert (does SSL_VERIFY_PEER work) + insecure accepts
      # it (positive control: the refusal comes from verify; if verify were broken it would behave like insecure).
      - name: PG TLS real-handshake verify (mock, no Docker)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/pg_tls_handshake_test.sh build/lk 7799
          # bytes injected before the TLS handshake (MySQL greeting, PG 'S') are refused
          bash tests/db_tls_injection_test.sh build/lk 55471

      # http:: TLS like Go's crypto/tls: IP SAN, no SNI for an IP, wrong name / expired /
      # self-signed / TLS 1.1 / unknown CA refused with the reason. Test servers are Go.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: "http:: TLS verification (Go test servers)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/http_client_tls_test.sh ./build/lk

      # json::decode accepts exactly what Go's encoding/json accepts and reads the same value: random
      # valid, edge and broken JSON texts go through LOOK and through a Go referee
      # (tests/input_fuzz/json_referee.go); any difference fails with the shortest example. Fixed seed;
      # LOOK_JSON_FUZZ_CASES=N runs more.
      - name: JSON differential fuzz (Go encoding/json as the referee)
        timeout-minutes: 10
        run: |
          cd cpp
          python3 tests/json_differential_test.py ./build/lk

      # Query strings, form bodies and route parameters: random requests to a real lk-fcgi --mode http
      # server, what request::all() / request::param() see compared with a small model of the
      # documented decoding rules. Fixed seed; LOOK_FORM_FUZZ_CASES=N runs more.
      - name: Form and URL decoding differential fuzz
        timeout-minutes: 10
        run: |
          cd cpp
          python3 tests/form_differential_test.py ./build/lk-fcgi

      # HTTP request parsing: random and malformed requests, request-smuggling shapes included, go as raw
      # bytes to lk-fcgi --mode http and to Go's net/http (tests/input_fuzz/http_referee.go), each followed
      # by a second request on the same connection. LOOK accepting what Go refuses, or framing a request
      # differently, fails; LOOK refusing more is allowed only for the smuggling defences and for requests
      # the RFCs make invalid. The referee needs a recent Go (1.27): older versions accept requests that
      # Go now refuses (an empty field name, more than 500 header fields).
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: HTTP request parsing differential fuzz (Go net/http as the referee)
        timeout-minutes: 15
        run: |
          cd cpp
          python3 tests/http_differential_test.py ./build/lk-fcgi

      # installer:: parse layer — NETWORK-FREE (parse_pkg rejections happen BEFORE the download): host restriction
      # (github.com only), invalid name, path-traversal (user + subdir). Positive control:
      # a legitimate name must pass the parse. (Zip-slip/redirect need a real download → C++ unit test
      # targeted follow-up; the full installer_test.sh needs a network → manual/nightly.)
      - name: "installer:: parse layer (host/name/traversal, no network)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/installer_parse_test.sh build/lk

      # installer:: Zip-Slip containment — security-decision seam (look/zip_safe.h). WITHOUT the real
      # extract/miniz: does the entry extract inside dest. Includes the sibling-prefix escape (repo→repo-evil,
      # separator boundary required), POSITIVE-CONTROLLED (if the boundary is removed the sibling-prefix escapes→FAIL).
      - name: "installer:: Zip-Slip containment (seam tablosu)"
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/installer_zipslip_test.cpp -o /tmp/izt
          /tmp/izt

      # installer:: redirect security-decision seam (look/url_safe.h). WITHOUT a real HTTP/3xx:
      # refusal of scheme downgrade (http://) + host escape (evilgithub.com / github.com.evil.com).
      # POSITIVE-CONTROLLED (if the https requirement is removed http:// escapes→FAIL).
      - name: "installer:: redirect security decision (seam table)"
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/installer_redirect_test.cpp -o /tmp/irt
          /tmp/irt

      # look.lock content checksum (h1:, like go.sum) and atomic install, without the network
      # (LOOK_INSTALL_ARCHIVE_DIR serves local zipballs): first install records it, same content
      # installs, changed content at the same commit is refused with the old package and look.lock
      # untouched, an old line without a checksum gets one, a corrupt archive keeps the old package
      # (packages and modules).
      - name: "installer:: look.lock checksum + atomic install (no network)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/installer_integrity_test.sh build/lk

      # SSRF private/special-block decision — seam (look/ssrf_safe.h). http_client's getaddrinfo
      # loop delegates to these predicates. No network/DNS: a decision table from raw bytes
      # (metadata 169.254.169.254 · NAT64 64:ff9b · 6to4 2002 · v4-mapped bypasses).
      # POSITIVE-CONTROLLED (if a branch is deleted the matching row goes RED).
      - name: SSRF private/special-block decision (seam table)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/ssrf_safe_test.cpp -o /tmp/ssrf
          /tmp/ssrf

      # int64 overflow detection — seam (look/int_overflow.h). operator+/-/* promotes to float on overflow
      # (NO signed-overflow UB). Table test of the overflow bounds + the INT64_MIN*-1 #DE(SIGFPE) trap.
      # POSITIVE-CONTROLLED. (Linux/CI __builtin branch; the MSVC branch is Tier-2 Windows.)
      - name: int64 overflow detection (seam table)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/int_overflow_test.cpp -o /tmp/iov
          /tmp/iov

      # session:: SID validation + blob injection defence — seam (look/session_esc.h).
      # Network-free: 32-hex allowlist (traversal refused) + a forged privilege field (admin=1)
      # CANNOT BE INJECTED via \n/=. POSITIVE-CONTROLLED (if value escaping is removed the injection passes).
      - name: "session:: SID + blob enjeksiyon (seam tablosu)"
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude tests/session_esc_test.cpp -o /tmp/sess
          /tmp/sess

      # docs-conformance — is every mod::fn in the docs present in the core (builtin_names)?
      # Closes the session::has class (docs promise it, core lacks it → user gets a 500) in bulk.
      # Pure text comparison (no build); the allowlist is justified, new drift fails.
      - name: docs-conformance (docs API ↔ builtin_names)
        timeout-minutes: 10
        run: bash cpp/tests/docs_conformance.sh

      # REVERSE DIRECTION: is every namespaced mod::fn in builtin_names() documented in docs/index.html?
      # The missing half of docs_conformance — a new builtin cannot pass CI without being documented.
      # The exclusion list is justified (validator rules + template {#} syntax), not known_fail.
      - name: docs-conformance reverse direction (builtin_names ↔ docs API)
        timeout-minutes: 10
        run: bash cpp/tests/doc_conformance_reverse.sh

      # SSRF DNS-rebinding pin invariant — measured: is_ssrf_blocked + connect use the SAME resolved
      # res->ai_addr (resolve-once, no re-resolution → rebinding is impossible). This guard
      # locks the source invariant; RED if someone turns connect into a re-resolve. Positive-controlled.
      - name: SSRF DNS-rebinding pin invariant (source guard)
        timeout-minutes: 10
        run: bash cpp/tests/ssrf_pin_guard.sh

      # Plesk installer privesc hardening — network-free, no Plesk. Do the domain/script/svc sanitization
      # (PHP regex + bash tr -cd + case guard) block injection (newline→systemd unit root command)?
      # Positive-controlled (if the sanitization is removed the privesc payload yields a 2-line unit).
      - name: "Plesk installer injection guards (no network)"
        timeout-minutes: 10
        run: |
          sudo apt-get install -y php-cli
          bash cpp/tests/plesk_inject_test.sh
          php  cpp/tests/plesk_php_domain_test.php

      # The Plesk extension runs each domain's service as the domain's system user, never as
      # root; the env file is read with that user's rights; Remove deletes the unit and its
      # .service.d. Runs the real enable.sh/disable.sh in a throwaway container (it creates users).
      - name: Plesk services run as the domain's user
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/w" -w /w almalinux:8 bash cpp/tests/plesk_service_user_test.sh

      # install.sh ignored every option it was given (the guide's --with-nginx went through without
      # a word and the port stayed open). An unknown option stops it before anything is installed.
      - name: Linux installer refuses options it does not have (Ubuntu, Debian, AlmaLinux)
        timeout-minutes: 10
        run: |
          for img in ubuntu:24.04 debian:12 almalinux:8 almalinux:9; do
            echo "== $img"
            docker run --rm -v "$PWD:/w" -w /w "$img" bash cpp/tests/linux_install_test.sh
          done

      # Updating the extension updates LOOK and rewrites every domain's service: Plesk runs the
      # hook as psaadm, the root step goes through sbin/look-setup. Plays a 1.1.0 → new upgrade
      # with the old binary running; a service that cannot leave root is stopped and reported.
      - name: Plesk update rewrites every service and updates LOOK
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/w" -w /w almalinux:8 bash cpp/tests/plesk_upgrade_test.sh

      # The panel user has no sudo rights: a '*' in sudoers also matches spaces, so
      # "systemctl enable look-*" allowed "systemctl enable look-a /tmp/evil.service". Root work
      # goes through sbin/look-ctl (callSbin), which checks the action, name and argument count.
      - name: Plesk panel has no sudo rights
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/w" -w /w almalinux:8 bash cpp/tests/plesk_no_sudo_test.sh

      # A site's env file may live outside its web root, a stopped site keeps refusing /.look*
      # files, and LOOK gets a LOOK_SECRET created as the domain's user (0600, never printed).
      - name: "Plesk keeps secrets out of the web root and creates LOOK_SECRET"
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/w" -w /w almalinux:8 bash cpp/tests/plesk_env_secret_test.sh

      # A site moves to a new LOOK release only when its code passes `lk --check` of that release;
      # a site that does not keeps the release it ran, and the panel names the lines and says it
      # receives no fixes, security fixes included. Unused releases are removed.
      - name: Plesk moves a site to a new LOOK only when its code passes the check
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/w" -w /w almalinux:8 bash cpp/tests/plesk_release_check_test.sh

      # web runs only on the VM: a program the VM cannot compile does not start (exit 1),
      # a runtime error is a 500 run once, a failed hot reload keeps the server up with a clear
      # 500, LOOK_BYTECODE=0 is ignored, a script without routes runs whole per request.
      - name: The web server runs only on the VM
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/vm_only_startup_test.sh ./build/lk-fcgi

      # The use rule with the top level on the VM only: a module function without its use line
      # stops startup (top level) or fails the request (route); a use line in an included file
      # opens the module; an unknown module and use timer stop startup.
      - name: The use rule holds in a web application
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/use_rule_web_test.sh ./build/lk-fcgi

      # Code that silently did nothing stops startup with the reason: the discarded result of a
      # pure built-in (array::push alone on a line) and a route on the built-in health path.
      - name: Silent no-ops stop the application at startup
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/silent_noop_startup_test.sh ./build/lk ./build/lk-fcgi

      # Every built-in has an effect class (src/builtins.cpp: builtin_effect): the discarded-result
      # rule applies only to Pure built-ins, so a new built-in without a class fails here.
      - name: Every built-in has an effect class
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/builtin_effect_table_test.sh

      # JWT security table — is the HS256 module SAFE against the classic holes: alg=none refusal,
      # RS256→HS256 key-confusion refusal, exp expiry, signature tampering + positive. verify does NOT
      # read the header alg (unconditional HMAC) → alg-confusion is structurally impossible. Positive-controlled.
      - name: JWT security (alg=none / key-confusion / exp / tamper + positive)
        timeout-minutes: 10
        run: |
          cd cpp
          ./build/lk tests/jwt_security.lk

      # FastCGI wire-parse table + fuzz — seam (look/fcgi_parse.h). Network-facing PRE-DISPATCH code
      # (nginx/Apache→FCGI record or LOOK_FCGI_BIND). BUG FOUND+FIXED: a truncated 4-byte
      # length field → parse_params infinite loop (worker DoS); the progress guard is locked. ASan table
      # + 200K fuzz + POSITIVE CONTROL (variant without the clamp → ASan heap-overflow).
      - name: FastCGI wire-parse (seam tablo + fuzz + DoS-regresyon)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/fcgi_parse_test.cpp -o /tmp/fcgi_parse_test
          timeout 60 /tmp/fcgi_parse_test
          g++ -std=c++17 -Iinclude -DFCGI_POSCTL -fsanitize=address,undefined \
            -fno-sanitize-recover=all tests/fcgi_parse_test.cpp -o /tmp/fcgi_posctl
          if timeout 30 /tmp/fcgi_posctl; then echo "::error::POSCTL has no teeth"; exit 1; \
          else echo "POSCTL caught by ASan (expected)"; fi

      # WebSocket frame-decode (seam table, ASan/UBSan) — untrusted-NETWORK surface.
      # Parser adversarial round: decode_frame had no unit guard. Security (mask
      # required, 16MB cap, control frame ≤125+FIN) + the RFC 6455 §5.2 conformance fix
      # (non-zero RSV + reserved opcode → protocol error) are pinned.
      - name: WebSocket frame-decode (seam tablo, ASan/UBSan)
        timeout-minutes: 10
        run: |
          cd cpp
          g++ -std=c++17 -Iinclude -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/ws_frame_test.cpp src/websocket.cpp -o /tmp/ws_frame_test
          timeout 60 /tmp/ws_frame_test

      # LOOK language-parser DoS guard — parser.cpp is the single front end shared by ALL engines (a parse
      # bug is differential-BLIND). In a recursive-descent parser deep nesting overflows the physical stack;
      # eval(untrusted) makes that attacker-reachable. The 3-layer depth guard
      # (MAX_STMT_DEPTH/EXPR_DEPTH/BINOP_CHAIN) is pinned in two modes (--check/VM):
      # deep nesting → a clean parse error, NEVER a crash/hang.
      - name: Parser DoS-guard (derin-yuvalama, --check + VM)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/parser_dos_guard.sh ./build/lk

      # LOOK parser fail-loud — two fail-SILENT footguns made fail-LOUD: an unclosed
      # `/*` (swallowed code → exit 0) is now an error; an int64-exceeding literal (silent float precision loss)
      # is now a stderr WARN (stdout unchanged). Positive+negative controlled (legitimate behaviour preserved).
      - name: Parser fail-loud (unterminated comment + int-overflow warn)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/parser_faillooud_guard.sh ./build/lk

      # Session + cookie security in THREE MODES (--mode http, FastCGI, CGI): cookie:: flags, the session
      # cookie's Secure (real HTTPS only; the client's X-Forwarded-Proto does not count), 0600/0700,
      # the session id chosen by the client, request headers. Previously only --mode http was tested;
      # CGI fell behind three times (cleanup, HTTPS, headers). Missing behaviour in any mode breaks CI.
      - name: Session and cookie security in all three modes
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/session_cookie_modes_test.sh build/lk-fcgi build/lk-cgi

      # file-include + timer::every together LOCKED the lk-fcgi start (the clone_for_thread
      # env clone re-cloned the shared closure env for every function and blew up as O(N!)).
      # use "lib.lk" (>10 sibling fns) + a top-level timer::every → the port must bind and serve.
      # POSITIVE CONTROL: the old path never bound at all → timeout → RED.
      - name: "file-include + timer::every startup binds (regresyon)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/timer_include_bind_test.sh build/lk-fcgi 7794

      # before_route prefix guard — SECURITY-CRITICAL. The dogfood's authentication is now a single
      # before_route + request::path() prefix (9 hand-written require_login → 1). If it breaks, /admin (/tasks in the dogfood)
      # opens without auth = a silent authorization bypass. Verifies 403/200 + nested against
      # lk-fcgi --mode http. POSITIVE-CONTROLLED: the variant without the guard gives /admin=200 (the test discriminates — sabotage→RED).
      - name: before_route prefix guard (authorization bypass regression)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/middleware_guard_test.sh build/lk-fcgi 7795

      # route::group() — Go/chi-style prefix + middleware inheritance (NO name/namespace, deliberately
      # minimal). Against lk-fcgi --mode http. Self-discriminating: if the prefix
      # breaks bare /solo opens (200, not 404), if mw breaks a no-token request returns 200 → the test goes RED.
      - name: "route::group prefix + middleware inheritance"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/route_group_test.sh build/lk-fcgi 7715

      # runtime::stats() observability counters — request_count/errors_5xx/latency/db_pool.
      # request_count was once broken to 0 on the web (setup interpreter vs VM path). Self-discriminating
      # delta assertions: if a counter is broken into a no-op the value stays flat → RED (sabotage→0 delta verified).
      - name: "runtime::stats counters (silent-problem indicators)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/runtime_stats_test.sh build/lk-fcgi 7778

      # lk fmt — source formatter (gofmt model). Canonicalizes indentation/whitespace; ABORTS if the token
      # sequence changes (meaning preservation). Guard: idempotency + meaning preservation + --check
      # exit codes + comment/multi-line-string preservation. Positive-controlled (RED if in-string content is corrupted).
      - name: lk fmt (idempotent + anlam-koruma + yorum/string)
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/fmt_test.sh build/lk

  # ── Live DB job: real MySQL 8 + PostgreSQL 16 service containers ──────────
  # caching_sha2_password (MySQL 8 DEFAULT auth) + native prepared bind (MySQL
  # COM_STMT_EXECUTE + PG extended-query) — the "live-DSN/nightly" gap of three PARTIAL items.
  # A fresh mysql:8 = empty cache → the first connection takes the full-auth (RSA) path; the bind matrix exercises the real
  # binary protocol. Embedded drivers (NO libmysqlclient/libpq) → lk only.
  db-live:
    name: "Live DB — caching_sha2 (MySQL 8) + prepared bind (MySQL 8 + PG 16)"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: lookci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lookci
          POSTGRES_PASSWORD: lookci
          POSTGRES_DB: lookci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U lookci -d lookci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev zlib1g-dev libzstd-dev
          # Ubuntu 26.04's static libcrypto also needs libjitterentropy.a (the package does not exist on 24.04)
          if apt-cache show libjitterentropy3-dev >/dev/null 2>&1; then sudo apt-get install -y libjitterentropy3-dev; fi
      - name: Build lk (Release)
        timeout-minutes: 10
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target look look-fcgi --parallel $(nproc)
      # caching_sha2: root@mysql:8 over TCP without TLS → fresh cache → full-auth RSA path (then fast).
      - name: "caching_sha2_password — real MySQL 8 (full-auth RSA + fast path)"
        timeout-minutes: 10
        env:
          MYDSN: "mysql://root:rootpw@127.0.0.1:3306/lookci"
          MYUSER: root
          MYHOST: 127.0.0.1
          MYPORT: "3306"
          MYDB: lookci
        run: |
          cd cpp
          bash tests/mysql_caching_sha2_ci.sh ./build/lk
      # A connection MySQL closes (wait_timeout, restart, KILL) does not kill LOOK: SIGPIPE killed
      # lk and lk-fcgi in FastCGI mode (exit 141). The test KILLs the connections itself.
      - name: "A dropped MySQL connection does not kill lk / lk-fcgi"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_dropped_connection_test.sh ./build/lk ./build/lk-fcgi "mysql://root:rootpw@127.0.0.1:3306/lookci" root
      # A connection the server closed (wait_timeout, restart, KILL, pg_terminate_backend) is
      # replaced before the query is sent: the first query no longer fails. A sent query is never
      # sent again, and inside a transaction it is an error (PostgreSQL used to reconnect there and
      # keep the rest of the transaction outside it).
      - name: "A connection the server closed is replaced before the query (MySQL 8 + PostgreSQL 16)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_stale_connection_test.sh ./build/lk ./build/lk-fcgi \
            "mysql://root:rootpw@127.0.0.1:3306/lookci" root "postgres://lookci:lookci@127.0.0.1:5432/lookci" lookci
      # native prepared bind matrisi — MySQL COM_STMT_EXECUTE + PG extended-query.
      - name: "Prepared bind matrisi — MySQL 8 + PostgreSQL 16 (native)"
        timeout-minutes: 10
        env:
          MYSQL_DSN: "mysql://root:rootpw@127.0.0.1:3306/lookci"
          PG_DSN: "postgres://lookci:lookci@127.0.0.1:5432/lookci"
        run: |
          cd cpp
          for f in db_bind_mysql db_bind_pg; do
            echo "== $f =="
            out="$(timeout 60 ./build/lk tests/behavioral/$f.lk 2>&1)"; echo "$out"
            echo "$out" | grep -q 'ran='  || { echo "::error::$f ended early (no ran=)"; exit 1; }
            echo "$out" | grep -q '^FAIL' && { echo "::error::$f bind assert kirildi"; exit 1; }
            true
          done
          echo "Native prepared-bind matrix (MySQL+PG) GREEN."
      # An INSERT inside a transaction is kept, and db::last_id belongs to that INSERT. The
      # driver used to ask for lastval() after every INSERT: on a table without a sequence that
      # failed, aborted the transaction, and the COMMIT silently rolled back; and lastval() is the
      # session's last sequence value, so last_id could be another table's (or request's) id.
      # MySQL connections end with COM_QUIT: without it MySQL counted each closed connection as
      # aborted (Aborted_clients) and logged a warning — every connection of a script's pool.
      - name: "MySQL 8 — a script leaves no aborted connection"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/mysql_quit_test.sh ./build/lk "mysql://root:rootpw@127.0.0.1:3306/lookci"
      # Each connection keeps the statements it prepared (one round trip per query instead of
      # PREPARE + EXECUTE + CLOSE) and reads through a buffer. The cache must never return a wrong
      # result: changed tables, one database per shop, a KILLed connection (statement ids restart
      # there), the server's global statement limit, transactions, concurrent web requests.
      - name: "MySQL 8 — statements prepared once per connection, never a wrong result"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/mysql_stmt_cache_test.sh ./build/lk ./build/lk-fcgi "mysql://root:rootpw@127.0.0.1:3306/lookci"
      # An error in the middle of the rows is an error (not a partial result); CALL's extra results
      # are read, so the next query and an open transaction are not affected.
      - name: "MySQL 8 — complete answers: mid-row errors, CALL results"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/mysql_result_integrity_test.sh ./build/lk ./build/lk-fcgi "mysql://root:rootpw@127.0.0.1:3306/lookci"
      # db::connect address: bad port is an error naming it (no password), empty port = default,
      # [::1] connects (MySQL/PG used to resolve IPv4 only), "host:3306?tls=" keeps its options.
      - name: "DSN address — ports, IPv6, options without a path (live MySQL 8 + PostgreSQL 16)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/db_dsn_address_test.sh ./build/lk "mysql://root:rootpw@127.0.0.1:3306/lookci" "postgres://lookci:lookci@127.0.0.1:5432/lookci"
      # A PostgreSQL query goes out in one send and replies are read through a buffer; results must
      # stay exact: 1 MB values, results spanning many buffers, failing queries, a terminated
      # connection, concurrent web requests.
      - name: "PostgreSQL 16 — one send per query, buffered replies, exact results"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/pg_transport_test.sh ./build/lk ./build/lk-fcgi "postgres://lookci:lookci@127.0.0.1:5432/lookci"
          # COPY FROM STDIN / TO STDOUT: an error at once (was a 30 s hang / a silent empty result)
          bash tests/pg_copy_test.sh ./build/lk "postgres://lookci:lookci@127.0.0.1:5432/lookci"
      - name: "PostgreSQL 16 — INSERT in a transaction is kept; last_id is that INSERT's"
        timeout-minutes: 10
        env:
          PG_DSN: "postgres://lookci:lookci@127.0.0.1:5432/lookci"
        run: |
          cd cpp
          out="$(timeout 60 ./build/lk tests/behavioral/pg_insert_id.lk 2>&1)"; echo "$out"
          echo "$out" | grep -q 'insert-id ran=17' || { echo "::error::pg_insert_id did not run all cases"; exit 1; }
          echo "$out" | grep -q '^FAIL' && { echo "::error::pg_insert_id failed"; exit 1; }
          true
      # Web server on real servers: a slow PostgreSQL query and a slow MySQL query over TLS must
      # hold only their own request (1.0.20–1.0.21 held the whole fiber thread). After the MySQL
      # auth steps: a TLS login caches the password and would hide the full-auth path above.
      - name: "Slow PostgreSQL 16 / MySQL 8 (TLS) query holds only its own request"
        timeout-minutes: 10
        env:
          PG_DSN: "postgres://lookci:lookci@127.0.0.1:5432/lookci"
          MY_DSN: "mysql://root:rootpw@127.0.0.1:3306/lookci?tls=insecure"
        run: |
          cd cpp
          out="$(bash tests/db_wait_test.sh ./build/lk-fcgi 2>&1)"; echo "$out"
          echo "$out" | grep -q 'pg_sleep(1) on PostgreSQL: plain' || { echo "::error::PostgreSQL case did not run"; exit 1; }
          echo "$out" | grep -q 'SLEEP(1) on MySQL over TLS: plain' || { echo "::error::MySQL TLS case did not run"; exit 1; }
          echo "$out" | grep -q '^PASS'
      # A Redis password containing '?' used to break the URL parse (host became ':pa').
      # Real server: the right password works, a wrong one and none are refused — the two
      # refusals prove the server really enforces the password.
      - name: "Redis — password containing '?' (live redis:7)"
        timeout-minutes: 10
        run: |
          set -e
          docker run -d --name look-redis-q -p 6380:6379 redis:7 redis-server --requirepass 'pa?ss'
          for i in $(seq 1 20); do docker exec look-redis-q redis-cli -a 'pa?ss' --no-auth-warning ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          cd cpp
          g++ -std=c++23 -Iinclude tests/redis_tls/harness.cpp build/CMakeFiles/look.dir/src/resp_client.cpp.o \
            build/CMakeFiles/look.dir/src/fiber_posix.cpp.o build/CMakeFiles/look.dir/src/mem_budget.cpp.o \
            -lssl -lcrypto -lpthread -o /tmp/resp_harness
          ok="$(/tmp/resp_harness 'redis://:pa?ss@127.0.0.1:6380/1' 2>&1 || true)";  echo "right password : $ok"
          bad="$(/tmp/resp_harness 'redis://:wrong@127.0.0.1:6380' 2>&1 || true)";   echo "wrong password : $bad"
          none="$(/tmp/resp_harness 'redis://127.0.0.1:6380' 2>&1 || true)";         echo "no password    : $none"
          echo "$ok"   | grep -q '^OK set/get' || { echo "::error::password with '?' did not authenticate"; exit 1; }
          echo "$bad"  | grep -q 'WRONGPASS'   || { echo "::error::wrong password was not refused"; exit 1; }
          echo "$none" | grep -q 'NOAUTH'      || { echo "::error::missing password was not refused"; exit 1; }
      # Session storage kept one Redis connection per worker thread: once a Redis wait suspended
      # only the fiber, two requests on one thread shared it and one could read the other's
      # session. A Redis that never answers used to hang the request forever.
      - name: "Redis sessions — each request sees only its own; a silent Redis times out (live redis:7)"
        timeout-minutes: 10
        run: |
          docker run -d --name look-redis-s -p 6381:6379 redis:7
          for i in $(seq 1 20); do docker exec look-redis-s redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          cd cpp
          bash tests/redis_session_isolation_test.sh ./build/lk-fcgi redis://127.0.0.1:6381
          # A pooled connection Redis closed (restart, timeout, CLIENT KILL) is replaced before use
          bash tests/redis_session_restart_test.sh ./build/lk-fcgi redis://127.0.0.1:6381
          bash tests/session_destroy_race_test.sh ./build/lk-fcgi redis://127.0.0.1:6381
          # concurrent session::regenerate keeps the data; a logout during it is not undone
          bash tests/session_regenerate_race_test.sh ./build/lk-fcgi redis://127.0.0.1:6381 7932
          # LOOK_REDIS_URL: bad port / database number is an error; /2 is used; [::1] connects
          bash tests/redis_url_test.sh ./build/lk-fcgi redis://127.0.0.1:6381
      # A session is at most LOOK_SESSION_MAX_BYTES (1 MB): over it session::set is an error,
      # nothing is written or cut. Same rule for the file and the Redis driver.
      - name: "Session size limit (file driver, and Redis on live redis:7)"
        timeout-minutes: 10
        run: |
          cd cpp
          bash tests/session_size_limit_test.sh ./build/lk-fcgi
          bash tests/session_size_limit_test.sh ./build/lk-fcgi redis://127.0.0.1:6381

  # ── PG TLS real-server interop job ───────────────────────────────────────
  # the mock (pg_tls_handshake_test) measures only the client's verify decision; this brings up the apt postgres
  # with initdb (a TLS-on + a TLS-off cluster, CA-signed SAN=localhost cert, scram) and proves the
  # REAL SSLRequest→'S'→TLS→startup→SCRAM-auth→SELECT roundtrip end to end.
  pg-tls-live:
    name: "PG TLS real-server interop (SSLRequest→TLS→startup→SCRAM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build + postgres + openssl
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev zlib1g-dev libzstd-dev postgresql openssl
          # Ubuntu 26.04's static libcrypto also needs libjitterentropy.a (the package does not exist on 24.04)
          if apt-cache show libjitterentropy3-dev >/dev/null 2>&1; then sudo apt-get install -y libjitterentropy3-dev; fi
      - name: Build lk (Release)
        timeout-minutes: 10
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target look --parallel $(nproc)
      # Vacuous-green guard (Rule-2): if the harness has no postgres/openssl it SKIPS with exit 0;
      # require the real PASS line — if it is skipped the job BREAKS (no silent green).
      - name: PG TLS real-server interop (6 cases + positive control)
        timeout-minutes: 10
        run: |
          cd cpp
          out="$(bash tests/pg_tls_realserver_test.sh build/lk 54330 54331)"; echo "$out"
          echo "$out" | grep -q '^PASS: PG TLS' || { echo "::error::PG TLS test was SKIPPED or broke (vacuous-green guard)"; exit 1; }

  # ── Concurrency hang smoke job (worker-pool + fiber) ──────────────────────
  # A bounded-concurrency guard for the c=100 hang regression (acceptor starvation, D Fix #2): c=50
  # concurrent × 20 keep-alive requests, in two dispatch modes (pool + fiber), ALL 200 + server
  # alive. Positive-controlled (dead-port + accept-only-hang server → RED). The c=100 upper end is nightly
  # (load is sensitive to machine noise); c=50 reliably exercises logic starvation in CI.
  concurrency-smoke:
    name: "Concurrency hang smoke (pool + fiber, c=50)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev zlib1g-dev libzstd-dev python3
          # Ubuntu 26.04's static libcrypto also needs libjitterentropy.a (the package does not exist on 24.04)
          if apt-cache show libjitterentropy3-dev >/dev/null 2>&1; then sudo apt-get install -y libjitterentropy3-dev; fi
      - name: Build lk-fcgi (Release)
        timeout-minutes: 10
        run: |
          cd cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target look-fcgi --parallel $(nproc)
      - name: Concurrency hang smoke (c=50 × 20, pool + fiber)
        timeout-minutes: 10
        run: bash cpp/tests/concurrency_smoke.sh cpp/build/lk-fcgi 50 20
      # Fiber-mode per-request web-context leak guard: many concurrent requests
      # with unique values, each yielding at http::get() between reading its input
      # and writing its response, must every one echo its OWN value. Regression:
      # the interpreter dispatch path shared a thread_local copy across interleaved
      # fibers → one user's data leaked into another's response.
      - name: Fiber web-context correctness (concurrent-different-output)
        timeout-minutes: 10
        run: bash cpp/tests/fiber_ctx/guard.sh cpp/build/lk-fcgi
