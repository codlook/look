# .github/workflows/workflow-lint.yml
# Checks all workflow files — in a SEPARATE file, because a check inside the file it checks
# does not run either when that file breaks. It happened twice: an unquoted step name in ci.yml
# ("name: csrf:: and …") broke the YAML; GitHub could not read the file, NOT ONE job of the main CI ran, and it went
# unnoticed because the other workflows looked green. actionlint checks the YAML syntax, the workflow schema and
# ${{ }} expressions. (shellcheck/pyflakes are off: the goal is that workflows can be READ; script
# quality is a separate job.) The binary's version AND its SHA-256 are pinned — if the download changes the step breaks.
name: workflow-lint
on: [push, pull_request]

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint (pinned version and SHA-256)
        run: |
          V=1.7.12
          F=actionlint_${V}_linux_amd64.tar.gz
          curl -fsSL -o "$F" "https://github.com/rhysd/actionlint/releases/download/v${V}/${F}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $F" | sha256sum -c -
          tar xzf "$F" actionlint
          ./actionlint -version
      - name: Every workflow file is valid (actionlint)
        run: ./actionlint -color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: No duplicated, hidden or unquoted-colon step names
        run: bash cpp/tests/ci_no_duplicate_steps.sh
