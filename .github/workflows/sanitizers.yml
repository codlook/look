# .github/workflows/sanitizers.yml
# Release build'in yakalayamadigi siniftaki hatalari (data race, stack overflow, UB)
# yakalar. Tasarim: yaris testleri enforced/ altinda ZORUNLU (kirilirsa CI kirmizi).
# (Onceki "known_fail/ + continue-on-error" bolgesi kaldirildi: fail-loud prensibinin
#  tersi bir "basarisizligin kabul edildigi yer"di; R-02/R-03 kapaninca bosaldi. Yeni bir
#  yaris cikarsa enforced/'a eklenir ve HEMEN kirar — "simdilik oraya koyalim" yok.)
name: sanitizers
on: [push, pull_request]

jobs:
  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Build (ASan+UBSan)
        working-directory: cpp
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLOOK_SANITIZE=address,undefined -DLOOK_STATIC_SSL=OFF
          cmake --build build-asan --target look -j"$(nproc)"
      - name: Regression (zorunlu — yesil olmali)
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/lk tests/regression_all.lk
      # B-01 DÜZELTİLDİ (parser MAX_BINOP_CHAIN=1000): derin ikili zincir + derin paren artık
      # AST kurulmadan parser'da TEMİZ hata verir (çökme DEĞİL) — saldırgan-kontrollü derin girdi
      # DoS'u kapalı. continue-on-error KALDIRILDI → enforced (guard tetiklenmezse/çökerse CI kırmızı).
      - name: B-01 eval-guard — ENFORCED (derin girdi temiz-hata, çökme değil)
        working-directory: cpp
        env: { ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1" }
        run: bash tests/eval_depth_guard.sh ./build-asan/lk

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Build (TSan)
        working-directory: cpp
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLOOK_SANITIZE=thread -DLOOK_STATIC_SSL=OFF
          cmake --build build-tsan --target look -j"$(nproc)"
      - name: Yaris testleri — ENFORCED (yesil olmali; kirilirsa CI kirmizi)
        working-directory: cpp
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:history_size=7:report_thread_leaks=0
        run: |
          # t4 = SQLITE_THREADSAFE=2 regresyonu (0 yaris vermeli). ext4 runner'da
          # overlayfs kilit belirsizligi yok — asil temiz A/B ortami burasi.
          for f in tests/tsan/enforced/*.lk; do
            echo "== $f"; ./build-tsan/lk "$f" || exit 1
            LOOK_CLI_VM=0 ./build-tsan/lk "$f" || exit 1   # her iki motor da temiz
          done

  fuzz:
    # Surdurulebilirlik: wire-protocol parser'lari her push'ta kisa fuzzlanir (libFuzzer,
    # clang zorunlu — GCC'de -fsanitize=fuzzer yok). Tek-seferlik denetim yerine surekli
    # tarama; bir regresyon (parser'a sinir-disi erisim) aninda CI'i kirar. Uzun kampanya
    # nightly/manuel. Hedefler saf ayristiricilar (look/*_parse.h) — socket'siz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: Fuzz — PG + MySQL + HTTP istek/wire parser (kisa, yesil olmali)
        working-directory: cpp/tests/fuzz
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          declare -A C=( [fuzz_pg_parse_error]=corpus_pgerr \
                         [fuzz_mysql_lenenc]=corpus_mysql \
                         [fuzz_json_str]=corpus_json \
                         [fuzz_smtp_addr]=corpus_smtp \
                         [fuzz_imap_parse]=corpus_imap \
                         [fuzz_http_request]=corpus_http )
          for h in "${!C[@]}"; do
            echo "== derle $h =="
            clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined \
                    -fno-sanitize-recover=all -I../../include "$h.cpp" -o "$h"
            echo "== kosum $h (30s) =="
            mkdir -p "${C[$h]}"
            ./"$h" -max_len=8192 -max_total_time=30 "${C[$h]}" || {
              echo "!!! $h fuzz bulgusu — crash artefakti yukarida"; exit 1; }
          done
