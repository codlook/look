# .github/workflows/sanitizers.yml
# Release build'in yakalayamadigi siniftaki hatalari (data race, stack overflow, UB)
# yakalar. Tasarim: yaris testleri enforced/ altinda ZORUNLU (kirilirsa CI kirmizi).
# (Onceki "known_fail/ + continue-on-error" bolgesi kaldirildi: fail-loud prensibinin
#  tersi bir "basarisizligin kabul edildigi yer"di; R-02/R-03 kapaninca bosaldi. Yeni bir
#  yaris cikarsa enforced/'a eklenir ve HEMEN kirar — "simdilik oraya koyalim" yok.)
name: sanitizers
on: [push, pull_request]

jobs:
  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Build (ASan+UBSan)
        timeout-minutes: 20
        working-directory: cpp
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLOOK_SANITIZE=address,undefined -DLOOK_STATIC_SSL=OFF
          cmake --build build-asan --target look look-fcgi -j"$(nproc)"
      - name: Regression (zorunlu — yesil olmali)
        timeout-minutes: 20
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/lk tests/regression_all.lk
      # Geri çağırma zincirinin dibindeki hata: her iç içe run() hata satırını taşınmış bir çerçeve
      # referansından okuyordu (heap-use-after-free) — yalnız ASan görür.
      - name: Error deep inside nested callbacks (no use-after-free)
        timeout-minutes: 20
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/lk tests/callback_error_frame.lk
      # Sayısal sınırlar UBSan altında: abs(INT64_MIN), aralık dışı double→int64 eskiden UB'ydi.
      - name: Numeric edge cases under UBSan (no report)
        timeout-minutes: 20
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash tests/numeric_edges_test.sh ./build-asan/lk
      # B-01 DÜZELTİLDİ (parser MAX_BINOP_CHAIN=1000): derin ikili zincir + derin paren artık
      # AST kurulmadan parser'da TEMİZ hata verir (çökme DEĞİL) — saldırgan-kontrollü derin girdi
      # DoS'u kapalı. continue-on-error KALDIRILDI → enforced (guard tetiklenmezse/çökerse CI kırmızı).
      - name: B-01 eval-guard — ENFORCED (derin girdi temiz-hata, çökme değil)
        timeout-minutes: 20
        working-directory: cpp
        env: { ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1" }
        run: bash tests/eval_depth_guard.sh ./build-asan/lk
      # select() cannot take a descriptor above 1023: FD_SET writes outside the fd_set. Answers stay
      # correct, so only this build shows it. The test fails if a low descriptor was still free.
      - name: Sockets above 1023 — database connect and IMAP idle with 1100 connections held
        timeout-minutes: 20
        working-directory: cpp
        run: bash tests/high_fd_sockets_test.sh ./build-asan/lk-fcgi
      # Database queries suspend the fiber mid-call (lock waits, long statements, a full write
      # queue handed to the connection's own thread). Any memory error there aborts the server and
      # the test fails. Fiber switches are announced to ASan (fiber_posix.cpp), so the
      # use-after-return check stays on.
      - name: Waiting database queries and concurrent SQLite writers under ASan
        timeout-minutes: 20
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          bash tests/db_wait_test.sh ./build-asan/lk-fcgi
          bash tests/sqlite_concurrent_writers_test.sh ./build-asan/lk-fcgi
          bash tests/fiber_request_isolation_test.sh ./build-asan/lk-fcgi
          LOOK_TEST_PREEMPT=1 bash tests/fiber_request_isolation_test.sh ./build-asan/lk-fcgi
          bash tests/cpu_turn_test.sh ./build-asan/lk-fcgi
          bash tests/shared_map_concurrent_test.sh ./build-asan/lk-fcgi
          ./build-asan/lk tests/assoc_index_test.lk | grep -q 'all checks passed'
      # MySQL and PostgreSQL clients against a hostile server: mutated replies (cut, flipped,
      # repeated packets, broken lengths, extra result sets, errors between rows) through the real
      # buffered socket path — every query ends with rows or an error, no memory error, no hang.
      - name: Database clients against hostile replies (mutation fuzz, ASan)
        timeout-minutes: 20
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          bash tests/db_wire_mutation_test.sh ./build-asan/lk 5000 "${{ github.run_number }}"

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Build (TSan)
        timeout-minutes: 20
        working-directory: cpp
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLOOK_SANITIZE=thread -DLOOK_STATIC_SSL=OFF
          cmake --build build-tsan --target look look-fcgi -j"$(nproc)"
      # The web server under TSan: fibers (switches are announced to TSan in fiber_posix.cpp),
      # requests suspended mid-way, WebSocket inboxes and close callbacks, timers / SSE. Any TSan
      # report fails the step. Tests with timing limits (cpu_turn) are left out: TSan is ~10x slower.
      # setarch -R: TSan maps its shadow at fixed addresses; with high ASLR entropy it can crash
      # at startup (measured locally).
      - name: Web server under TSan — fibers, WebSocket, timers
        timeout-minutes: 20
        working-directory: cpp
        env:
          TSAN_OPTIONS: halt_on_error=0:report_thread_leaks=0:history_size=7:log_path=/tmp/tsan
        run: |
          mkdir -p /tmp/w
          printf '#!/bin/sh\nexec setarch "$(uname -m)" -R %s/build-tsan/lk-fcgi "$@"\n' "$PWD" > /tmp/w/lk-fcgi
          chmod +x /tmp/w/lk-fcgi
          # warm start: the first start of a large TSan binary can outlast a test's readiness wait
          ( /tmp/w/lk-fcgi --version >/dev/null 2>&1 || true )
          fail=0
          for t in fiber_request_isolation_test ws_message_order_test ws_on_reregister_test ws_close_callback_test \
                   ws_callback_context_test realtime_isolation_test hot_reload_ws_callback_test \
                   session_destroy_race_test ws_handshake_check_test shared_map_concurrent_test \
                   graceful_shutdown_test; do
            echo "== $t"; bash tests/$t.sh /tmp/w/lk-fcgi || fail=1
          done
          # memory limit: request accounts follow fibers across threads; the biggest request is
          # chosen under a lock while others allocate
          echo "== memory_budget_test"
          bash tests/memory_budget_test.sh /tmp/w/lk-fcgi 7940 "$PWD/build-tsan/lk" || fail=1
          LOOK_FIBER_DISPATCH=0 bash tests/memory_budget_test.sh /tmp/w/lk-fcgi 7950 "$PWD/build-tsan/lk" || fail=1
          if ls /tmp/tsan*>/dev/null 2>&1 && grep -q "WARNING: ThreadSanitizer" /tmp/tsan*; then
            grep -h -A30 "WARNING: ThreadSanitizer" /tmp/tsan* | head -200; fail=1
          fi
          exit $fail
      - name: Yaris testleri — ENFORCED (yesil olmali; kirilirsa CI kirmizi)
        timeout-minutes: 20
        working-directory: cpp
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:history_size=7:report_thread_leaks=0
        run: |
          # t4 = SQLITE_THREADSAFE=2 regresyonu (0 yaris vermeli). ext4 runner'da
          # overlayfs kilit belirsizligi yok — asil temiz A/B ortami burasi.
          for f in tests/tsan/enforced/*.lk; do
            echo "== $f"; ./build-tsan/lk "$f" || exit 1
          done
          # Betik sonu: görev kaydı, durum atomikleri, kanal teslim anı (parallel_runtime.h)
          bash tests/parallel_exit_warning_test.sh ./build-tsan/lk 3
          # Kanal kilitlenmesi muhasebesi + tamponsuz teslim (parallel_runtime.h ChanWait)
          bash tests/channel_unbuffered_test.sh ./build-tsan/lk ./build-tsan/lk-fcgi

  fuzz:
    # Surdurulebilirlik: wire-protocol parser'lari her push'ta kisa fuzzlanir (libFuzzer,
    # clang zorunlu — GCC'de -fsanitize=fuzzer yok). Tek-seferlik denetim yerine surekli
    # tarama; bir regresyon (parser'a sinir-disi erisim) aninda CI'i kirar. Uzun kampanya
    # nightly/manuel. Hedefler saf ayristiricilar (look/*_parse.h) — socket'siz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: Fuzz — PG + MySQL + HTTP istek/wire parser (kisa, yesil olmali)
        timeout-minutes: 20
        working-directory: cpp/tests/fuzz
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          declare -A C=( [fuzz_pg_parse_error]=corpus_pgerr \
                         [fuzz_mysql_lenenc]=corpus_mysql \
                         [fuzz_json_str]=corpus_json \
                         [fuzz_smtp_addr]=corpus_smtp \
                         [fuzz_imap_parse]=corpus_imap \
                         [fuzz_http_request]=corpus_http )
          for h in "${!C[@]}"; do
            echo "== derle $h =="
            clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined \
                    -fno-sanitize-recover=all -I../../include "$h.cpp" -o "$h"
            echo "== kosum $h (30s) =="
            mkdir -p "${C[$h]}"
            ./"$h" -max_len=8192 -max_total_time=30 "${C[$h]}" || {
              echo "!!! $h fuzz bulgusu — crash artefakti yukarida"; exit 1; }
          done
      # Bundled decoders that take attacker bytes and need their own sources: the gzip response
      # decoder of http:: (miniz tinfl — the client path of the Node2Shell / CVE-2026-111497 class)
      # and the WebSocket frame decoder. -timeout catches a decoder that loops on a malformed stream.
      - name: Fuzz — gzip response decoder (miniz) + WebSocket frame decoder
        timeout-minutes: 20
        working-directory: cpp/tests/fuzz
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          sudo apt-get install -y libssl-dev
          python3 make_seeds.py .
          S="-g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -I../../include -I../../src"
          clang -g -O1 -fsanitize=fuzzer-no-link,address,undefined -c ../../src/miniz/miniz.c -I../../src -o miniz.o
          clang++ -std=c++23 $S fuzz_gzip_inflate.cpp miniz.o -o fuzz_gzip_inflate
          clang++ -std=c++23 $S fuzz_ws_frame.cpp ../../src/websocket.cpp -lssl -lcrypto -o fuzz_ws_frame
          for h in fuzz_gzip_inflate:corpus_gzip fuzz_ws_frame:corpus_ws; do
            b=${h%%:*}; c=${h##*:}
            echo "== $b (60s) =="
            ./"$b" -max_len=65536 -timeout=10 -max_total_time=60 "$c" || {
              echo "!!! $b fuzz finding — crash artifact above"; exit 1; }
          done
