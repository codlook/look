name: Release — build, gate & publish (Linux Tier-1 core)

# Release automation (#5). Tag push → build + GATE + publish.
#
# VERSION: single source is project(... VERSION x.y.z) in cpp/CMakeLists.txt
# (read by platforms/version.sh). The tag must be v<version> (v1.0.1); on a mismatch the job stops. File
# names and the Docker tag carry this version; unversioned FIXED-name copies
# (look-lang-linux.zip ...) are also published so that /releases/latest/download/ links work for every
# release. The old model ("1.0.0 fixed, the v1.0 tag moves") was dropped: a fix that changed behaviour
# used to arrive silently under the same number. The v1.0 release and the
# codlook/look:1.0.0 image stay as they are: they are never overwritten.
#
# REAL RELEASE FLOW: (1) open a DRAFT release for v<version>, upload the Windows package
# (hand-built MSVC build) to it; (2) push the tag → this job adds the Linux/Plesk/Docker
# artifacts to the draft, checks consistency and ONLY THEN publishes the draft.
# An inconsistent release never becomes visible.
#
# THE GATE IS INSIDE (critical): release_gate.lk 7/7 + crypto_vectors.lk 17/17 run AFTER the build and
# BEFORE the upload. If the gate fails the job stops there → the upload step is NEVER reached.
# This closes the one real risk of the automation (auto-publishing an unverified artifact).
# POSITIVE CONTROL: break the gate on purpose (e.g. a wrong assert in release_gate) → the workflow must NOT upload.
# It should be demonstrated once on an rc-tag rehearsal (green cannot be trusted without having seen red).
#
# REHEARSAL: before a real release run the whole pipeline with a tag like `v1.0.1-rc1` (-rc* → separate
# prerelease, NO push to Docker Hub). To rehearse the draft path too, open a
# draft release named after the rc tag and upload the Windows package, then push the rc tag.
#
# WINDOWS (2026-11-18): the package is now built in this workflow (job `windows`, windows-latest + MSVC,
# platforms/windows/build.ps1 gate) and the Linux job adds it to the release. It used to be built by hand and
# uploaded to the draft: a release depended on the developer's computer. The same steps run in windows.yml on every push
# (packaging is tested in advance). A draft release is still REQUIRED — the release notes are written there.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # for gh release upload/create

jobs:
  windows:
    name: Windows — MSVC build, gate, package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The stamp is 7 characters: same as the Linux binaries (the consistency step looks for this stamp inside the Windows .exe).
      - name: MSVC Release build (lk, lk-fcgi, lk-cgi)
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          cmake -S cpp -B cpp/build-win "-DLOOK_BUILD=$sha"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build cpp/build-win --config Release --target look look-fcgi look-cgi
          if ($LASTEXITCODE -ne 0) { throw "MSVC build failed" }
          $v = & cpp/build-win/Release/lk.exe --version
          if ($v -notmatch [regex]::Escape($sha)) { throw "build stamp is wrong: [$v], expected $sha" }
          Write-Host $v
      # build.ps1: the gate for the MSVC branches (crypto/rs256/date/release_gate) — if red, NO package.
      - name: Gate + package (platforms/windows/build.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & platforms/windows/build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: platforms/windows/look-lang-windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux/Docker/Plesk — build, gate, publish
    needs: windows
    runs-on: ubuntu-latest
    # the secrets context CANNOT be used in 'if:' → put it in job-level env, check the env in the if.
    env:
      DOCKERHUB_USERNAME: codlook   # public namespace — fixed; only the TOKEN is a secret
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # 0) Version — the single source is CMakeLists. The tag must be v<version> or v<version>-rc<N>:
      # a release tagged with the wrong number would carry another version's file names.
      - name: Resolve version (tag must match the source)
        run: |
          set -e
          VERSION="$(bash platforms/version.sh)"
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            "v$VERSION"|"v$VERSION"-rc*) ;;
            *) echo "::error::tag $TAG does not match the source version $VERSION (expected v$VERSION or v$VERSION-rcN)"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version $VERSION, tag $TAG"

      # 0b) Is it the newest? The "Latest" marker (/releases/latest/download/... links, install scripts)
      # and Docker :latest go ONLY to the highest-numbered release. When a release of a maintenance line (1.0.49)
      # came out after the new line (1.1.1) it used to take both: installs would go back to the old line.
      - name: Is this the newest release?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CUR="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          CUR="${CUR#v}"
          if [ -z "$CUR" ] || [ "$(printf '%s\n%s\n' "$CUR" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            echo "IS_NEWEST=1" >> "$GITHUB_ENV"; echo "newest: $VERSION (current Latest: ${CUR:-none})"
          else
            echo "IS_NEWEST=0" >> "$GITHUB_ENV"; echo "not the newest: $VERSION < $CUR — Latest and docker :latest stay on $CUR"
          fi

      # 1) Toolchain image (gcc-toolset-12 + cmake embedded)
      - name: Build look-build image
        run: docker build -t look-build -f cpp/Dockerfile.build cpp/

      # 2) Portable static build (glibc-2.28-only; static OpenSSL/libstdc++)
      - name: Portable static build @ HEAD
        run: |
          # Stamp = short git-sha (no .git in the container → pass it via env; otherwise the binary is stamped "src"
          # and which commit was built becomes invisible — seen at rc3).
          docker run --rm -e LOOK_BUILD="${GITHUB_SHA::7}" \
            -v "$PWD/cpp:/look/cpp" -w /look/cpp look-build bash build-portable.sh
          # FAIL-LOUD: the recipe's "cmake | grep" swallows the exit code → verify the binary BY HAND
          # (otherwise a link error looks like success = false-green, the class closed in this round).
          for b in lk lk-fcgi lk-cgi; do
            test -x "cpp/build-portable/$b" || { echo "LINK FAIL: cpp/build-portable/$b was not produced"; exit 1; }
          done
          docker run --rm -v "$PWD/cpp:/look/cpp" -w /look/cpp look-build \
            bash -c "ldd cpp/build-portable/lk-fcgi 2>&1 || true" || true

      # 3) ── GATE (fail → the following steps do not run, NO upload) ──
      # NOTE: bash -c DOUBLE quotes + no apostrophes (the apostrophe of the Turkish "binary'ye" broke the single-quoted
      # bash -c and gave "syntax error near )" — seen at rc1).
      - name: GATE — release_gate 7/7 + crypto KAT 17/17
        run: |
          docker run --rm -v "$PWD/cpp:/look/cpp" -w /look/cpp look-build \
            bash -c "set -e; ./build-portable/lk tests/release_gate.lk; ./build-portable/lk tests/crypto_vectors.lk"

      # 4) Package — Linux zip + Plesk zip (binary embedded)
      - name: Package Linux + Plesk zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash platforms/linux/build.sh
          mkdir -p platforms/plesk/bin
          cp cpp/build-portable/lk cpp/build-portable/lk-fcgi cpp/build-portable/lk-cgi platforms/plesk/bin/
          # The Plesk extension also carries the latest release of the maintenance line (release-1.0),
          # checked against its SHA256SUMS.txt and its tag's commit; when that line exists and cannot be
          # bundled, the release stops (platforms/plesk/bundle-maintenance.sh).
          bash platforms/plesk/bundle-maintenance.sh
          bash platforms/plesk/build.sh --with-binaries

      # Must be in every binary package named in the docs (lk-cgi was in no package up to 1.0.40:
      # CGI users did not get the session security fixes). If missing, NO upload.
      - name: GUARD — every binary the docs name is in the packages
        run: |
          bash cpp/tests/package_binaries_guard.sh \
            "platforms/linux/look-lang-linux-$VERSION.zip" "platforms/plesk/look-lang-plesk-$VERSION.zip"

      # 5) Docker image → tarball (installable with docker load, even without Hub)
      - name: Docker image → look-docker.tar.gz
        run: |
          # --build-arg LOOK_BUILD: .dockerignore drops .git, so there is no git in the container;
          # if we do not pass the sha the image is stamped "docker" (same class of problem as portable "src").
          docker build --build-arg LOOK_BUILD="${GITHUB_SHA::7}" \
            -t "codlook/look:$VERSION" -t codlook/look:latest \
            -f cpp/docker/Dockerfile.production .
          docker save "codlook/look:$VERSION" | gzip > look-docker.tar.gz

      # 5b) Windows package — produced by the `windows` job (same commit, same stamp).
      - uses: actions/download-artifact@v7
        with:
          name: windows-package
          path: winpkg

      # 6) Collect the artifacts + pull the vsix from the draft + SHA256SUMS (covers ALL of them)
      # The Windows package comes from the `windows` job; an old hand-uploaded Windows zip in the draft is
      # overwritten by it. The vsix is uploaded by hand (if present) — SHA256SUMS + consistency (7.5) cover everything.
      - name: Collect artifacts + fetch Win/vsix + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dist
          cp "platforms/linux/look-lang-linux-$VERSION.zip" dist/
          cp "platforms/plesk/look-lang-plesk-$VERSION.zip" dist/
          cp look-docker.tar.gz dist/
          gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --pattern "look-lang-windows-$VERSION.zip" --pattern '*.vsix' --dir dist --clobber 2>/dev/null || true
          [ -f "winpkg/look-lang-windows-$VERSION.zip" ] \
            || { echo "::error::the windows job did not produce look-lang-windows-$VERSION.zip"; exit 1; }
          cp "winpkg/look-lang-windows-$VERSION.zip" dist/
          # Unversioned FIXED-name copies: /releases/latest/download/look-lang-linux.zip gives the latest package
          # from the same address on every release (the docs links use this).
          for p in linux plesk windows; do
            [ -f "dist/look-lang-$p-$VERSION.zip" ] && cp "dist/look-lang-$p-$VERSION.zip" "dist/look-lang-$p.zip"
          done
          # subshell → the outer shell stays at the repo root; with nullglob a missing vsix does not pass the literal '*.vsix'
          ( cd dist && shopt -s nullglob && sha256sum *.zip *.tar.gz *.vsix > SHA256SUMS.txt )
          echo "=== dist ==="; ls -1 dist
          echo "=== SHA256SUMS ==="; cat dist/SHA256SUMS.txt

      # 7) Upload — if a release (draft) exists add to it; if not: rc → open a prerelease, real → STOP.
      # A draft is REQUIRED for a real release: the Windows package is found only there, and the draft
      # is visible to nobody until the consistency check (7.5) passes.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          cd dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists — adding assets (build $GITHUB_SHA)"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" *.zip *.tar.gz SHA256SUMS.txt --clobber
          elif [[ "$TAG" == *-rc* ]]; then
            echo "PROVA — pre-release $TAG"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "LOOK $TAG (release rehearsal)" \
              --notes "Release pipeline rehearsal. Build $GITHUB_SHA." \
              *.zip *.tar.gz SHA256SUMS.txt
          else
            echo "::error::no draft release for $TAG — create a draft release for this tag with the release notes, then push the tag again"
            exit 1
          fi

      # 7.5) CONSISTENCY (INLINE) — all binary assets carry the SAME stamp + manifest coverage.
      # release-consistency.yml was a SEPARATE workflow, but releases created with GITHUB_TOKEN do not
      # trigger downstream workflows (recursive-run protection) → the guard was DEAD on the automatic path. It was taken
      # inline here: it runs AFTER the upload, BEFORE the Docker Hub push → an inconsistent release does not reach Hub.
      # At 403d2dd Windows was left at 5465074; this step closes that class automatically.
      # rc: no Windows (Tier-2 is separate) → skipped; real v*: Windows is REQUIRED, otherwise FAIL.
      # POSITIVE CONTROL: put an old-stamped binary in an asset → this step goes RED (show it in the rc rehearsal).
      - name: CONSISTENCY — do the asset stamps match + manifest coverage (inline)
        run: |
          set -e
          cd dist
          unzip -oq look-lang-linux-*.zip -d _linux
          REF=$(_linux/bin/lk --version | sed -n 's/.*(\([0-9a-f]\{7\}\),.*/\1/p')
          [ -n "$REF" ] || { echo "::error::could not read the linux stamp"; exit 1; }
          echo "REFERENCE stamp (linux): $REF"
          fail=0
          # Version: the number the binary reports must equal the one in the file name.
          _linux/bin/lk --version | grep -q "LOOK $VERSION " \
            && echo "  OK   version $VERSION" \
            || { echo "  FAIL version: binary says [$(_linux/bin/lk --version)], expected $VERSION"; fail=1; }
          # Fixed-name copies must be byte-identical to the versioned file.
          for p in linux plesk windows; do
            [ -f "look-lang-$p-$VERSION.zip" ] || continue
            cmp -s "look-lang-$p-$VERSION.zip" "look-lang-$p.zip" \
              && echo "  OK   look-lang-$p.zip == look-lang-$p-$VERSION.zip" \
              || { echo "  FAIL look-lang-$p.zip differs from the versioned file"; fail=1; }
          done
          unzip -oq look-lang-plesk-*.zip -d _plesk
          if [ -f _plesk/htdocs/bin/lk ]; then
            chmod +x _plesk/htdocs/bin/lk
            P=$(_plesk/htdocs/bin/lk --version | sed -n 's/.*(\([0-9a-f]\{7\}\),.*/\1/p')
            [ "$P" = "$REF" ] && echo "  OK   plesk  $P" || { echo "  FAIL plesk  $P != $REF"; fail=1; }
          else echo "  FAIL plesk: htdocs/bin/lk is MISSING — broken packaging"; fail=1; fi
          # The shipped binaries carry their memory-safety protections (PIE, full RELRO, NX, canaries, fortify).
          bash "$GITHUB_WORKSPACE/cpp/tests/binary_hardening_check.sh" \
            _linux/bin/lk _linux/bin/lk-fcgi _plesk/htdocs/bin/lk _plesk/htdocs/bin/lk-fcgi || fail=1
          docker load < look-docker.tar.gz >/dev/null
          D=$(docker run --rm "codlook/look:$VERSION" lk --version | sed -n 's/.*(\([0-9a-f]\{7\}\),.*/\1/p')
          [ "$D" = "$REF" ] && echo "  OK   docker $D" || { echo "  FAIL docker $D != $REF"; fail=1; }
          # Windows: WITHOUT running it — does the reference stamp appear inside the .exe (strings/grep)
          if ls look-lang-windows-*.zip >/dev/null 2>&1; then
            unzip -oq look-lang-windows-*.zip -d _win
            if grep -aq "$REF" _win/lk.exe && grep -aq "$REF" _win/lk-fcgi.exe && grep -aq "$REF" _win/lk-cgi.exe; then
              echo "  OK   windows (stamp $REF is in the .exe)"
            else echo "  FAIL windows: $REF is NOT in lk.exe/lk-fcgi.exe/lk-cgi.exe (old manual build?)"; fail=1; fi
            bash ../cpp/tests/package_binaries_guard.sh look-lang-linux-$VERSION.zip look-lang-plesk-$VERSION.zip \
              look-lang-windows-$VERSION.zip || fail=1
          elif [[ "$GITHUB_REF_NAME" == *rc* ]]; then
            echo "  SKIP windows (rc rehearsal — Windows Tier-2 is built separately)"
          else
            echo "::error::windows asset is MISSING — REQUIRED in a real release (build it by hand and upload it)"; fail=1
          fi
          # Manifest count lock: is every asset in the release (except SHA256SUMS) in a manifest line
          MAN=$(grep -cE '^[0-9a-f]{64}' SHA256SUMS.txt)
          ASSETS=$(ls *.zip *.tar.gz *.vsix 2>/dev/null | wc -l)
          echo "  manifest lines=$MAN | assets=$ASSETS"
          [ "$MAN" = "$ASSETS" ] || { echo "::error::manifest $MAN != asset $ASSETS — an asset is outside the manifest"; fail=1; }
          echo ""
          [ "$fail" = 0 ] || { echo "::error::Asset stamps DIFFER — the release is inconsistent"; exit 1; }
          echo "CONSISTENT: all binary assets are $REF"

      # 7.6) Publish the draft — ONLY after consistency has passed. rc: stays a prerelease.
      - name: Publish the release (only after the consistency check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-rc* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          elif [ "$IS_NEWEST" = 1 ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets \
            --jq '"published: \(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'

      # 8) Docker Hub push — only if the secret exists (otherwise skip; the maintainer pushes by hand).
      # SKIPPED for rc* tags: Docker Hub has no tag isolation → an rc would overwrite :latest
      # and break the rehearsal's promise of "not overwriting the real release" on the Docker side (a GitHub prerelease is
      # isolated, Docker is not). rc = only a gate+build+asset rehearsal; the real push is only for v* (without rc).
      - name: Docker Hub push (if the secret exists, not for rc)
        if: ${{ env.DOCKERHUB_TOKEN != '' && !contains(github.ref_name, 'rc') }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          # Only :$VERSION and :latest. Old version tags (e.g. :1.0.0) are NOT TOUCHED.
          docker push "codlook/look:$VERSION"
          if [ "$IS_NEWEST" = 1 ]; then docker push codlook/look:latest; else echo "codlook/look:latest not moved (not the newest release)"; fi

      # 9) main must show the newest release. Forgotten at 1.1.2: whoever opened the repo on GitHub saw the code of
      # 1.1.1. The workflow does not move main itself (an open branch; fast-forwarded by hand), it only writes that it is behind
      # as a warning + summary. No main check for rc and old-line (IS_NEWEST=0) releases.
      - name: Check that main points at the newest release
        if: ${{ !contains(github.ref_name, 'rc') && env.IS_NEWEST == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ST="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)"
          case "$ST" in
            identical) echo "main points at ${GITHUB_REF_NAME}" ;;
            ahead) MSG="main is behind ${GITHUB_REF_NAME}: fast-forward it with  git push origin ${GITHUB_REF_NAME}^{}:refs/heads/main" ;;
            *) MSG="main and ${GITHUB_REF_NAME} are not in a fast-forward relation (compare status: $ST); check main by hand" ;;
          esac
          if [ -n "${MSG:-}" ]; then
            echo "::warning::$MSG"
            echo "### ⚠️ $MSG" >> "$GITHUB_STEP_SUMMARY"
          fi
