# Windows (Tier-2) CI — MSVC build + known-answer gate for the Windows-only crypto/date branches.
# Scope is IDENTICAL to the build.ps1 pre-release gate: look + look-fcgi MSVC build, then against the real
# MSVC binary crypto_vectors (SHA/HMAC/base64 + BCrypt random) · rs256_kat (NCrypt
# rs256 verify/sign) · date_dst (MSVC CRT calendar). These branches are NEVER exercised in Linux CI.
#
# 2026-08-12: the first workflow_dispatch run was green on the FIRST try (MSVC build + gate 17/17·5/5·7/7,
# no environment error) → the push trigger was added. Runs on every push to main (releases come from main);
# so that feature branches are not tired out by the slow MSVC, only main + v2 + manual trigger. v2 added (2026-10-04):
# the v2 branch's changes accumulate there; MSVC differences should not wait for merge day into main. NO continue-on-error.
name: windows-tier2

on:
  push:
    branches: [main, v2]
  workflow_dispatch: {}

jobs:
  msvc-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # look-cgi too: the Windows package contains lk-cgi.exe (build.ps1); because CI did not build it
      # the failure to link on MSVC was seen only in the release build (shutdown.cpp was missing).
      - name: MSVC Release build (look + look-fcgi + look-cgi)
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)   # same length as Linux (7)
          cmake -S cpp -B cpp/build-win "-DLOOK_BUILD=$sha"
          cmake --build cpp/build-win --config Release --target look look-fcgi look-cgi
          if (-not (Test-Path cpp/build-win/Release/lk.exe))      { throw "lk.exe uretilmedi" }
          if (-not (Test-Path cpp/build-win/Release/lk-fcgi.exe)) { throw "lk-fcgi.exe uretilmedi" }
          if (-not (Test-Path cpp/build-win/Release/lk-cgi.exe))  { throw "lk-cgi.exe uretilmedi" }
          # Is the stamp really the commit: with "-DLOOK_BUILD=$sha" unquoted PowerShell did not expand it,
          # the binaries said "($sha, windows/amd64)" and nobody noticed.
          $v = & cpp/build-win/Release/lk.exe --version
          if ($v -notmatch [regex]::Escape($sha)) { throw "build stamp is wrong: [$v], expected $sha" }
          Write-Host $v

      # The Windows-only branches (NCrypt rs256 · BCrypt random/sha256 · MSVC CRT date) run only on a REAL
      # MSVC binary. If any is red the job fails (no silent hole).
      - name: Pre-release gate (against the MSVC binary)
        shell: pwsh
        run: |
          $lk = "cpp/build-win/Release/lk.exe"
          foreach ($t in @("cpp/tests/crypto_vectors.lk","cpp/tests/rs256_kat.lk","cpp/tests/date_dst_test.lk")) {
            Write-Host "== $t =="
            & $lk $t
            if ($LASTEXITCODE -ne 0) { throw "GATE RED: $t Windows binary'sinde FAIL (exit $LASTEXITCODE)" }
          }
          Write-Host "PASS: Windows Tier-2 gate (crypto_vectors + rs256_kat + date_dst)"

      # Release package: the SAME step as release.yml's `windows` job (build.ps1 gate + zip). Runs on every push
      # so that if packaging breaks before release day it shows up here; the zip is a job artifact.
      - name: Gate + package (platforms/windows/build.ps1, as in a release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & platforms/windows/build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: platforms/windows/look-lang-windows-*.zip
          if-no-files-found: error
          retention-days: 7

      # int64 overflow detection, MSVC #else branch — it was NEVER exercised because of the Linux __builtin.
      # int_overflow_test.cpp is header-only → compiled with cl.exe the MSVC branch (unsigned wraparound +
      # the INT64_MIN*-1 idiv #DE guard) really runs. vswhere+vcvars is self-contained (does not disturb the cmake
      # build's environment — a separate step). NO continue-on-error.
      - name: "int64 overflow detection (MSVC #else branch)"
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /I cpp\include cpp\tests\int_overflow_test.cpp /Fe:iov_msvc.exe /Fo:iov_msvc.obj
          if errorlevel 1 exit /b 1
          iov_msvc.exe

      # Does the --mode http HTTP server really run on Windows: 200 + idle-timeout close.
      # Exercises the MSVC binary produced in the first step (the fixed SO_RCVTIMEO DWORD-ms branch).
      # LOOK_HTTP_IDLE_MS=1000 → idle-close ~1s (test speed; default 30s). The process is killed by PID
      # (no broad kill). Positive control: wrong-port refusal + body check + idle alive BEFORE, closed AFTER.
      # NO continue-on-error. (OLD BUG: on Win timeval→30ms; fixed with the DWORD-ms fix.)
      - name: "--mode http + idle-timeout (Windows HTTP server proof)"
        shell: pwsh
        env:
          LOOK_HTTP_IDLE_MS: "1000"
        run: |
          # win_http_idle.ps1 throws in every failure case (does not use exit) → a terminating
          # error breaks the pwsh step. The $LASTEXITCODE check was WRONG: on success the ps1 does not set
          # exit (stays $null), $null -ne 0 → true → false throw. The check was removed.
          $ErrorActionPreference = "Stop"
          & cpp/tests/win_http_idle.ps1 `
            -Exe cpp/build-win/Release/lk-fcgi.exe `
            -Script cpp/tests/win_http_idle_app.lk `
            -Port 7788
      # WebSocket backpressure on IOCP: a flood of tiny frames to a slow handler must not grow the
      # server's memory (the full inbox stops reading, as epoll's pause_read does on Linux), and
      # another client keeps getting answers. Before IOCP had pause_read the server read it all.
      - name: "WebSocket backpressure (IOCP pause_read)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python cpp/tests/ws_backpressure_portable_test.py cpp/build-win/Release/lk-fcgi.exe 7795
          if ($LASTEXITCODE -ne 0) { throw "ws_backpressure_portable_test failed" }
