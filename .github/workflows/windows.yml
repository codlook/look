# Windows (Tier-2) CI — MSVC build + Windows-only kripto/tarih dallarının known-answer kapısı.
# Kapsam build.ps1 pre-release gate'i ile BİREBİR: look + look-fcgi MSVC build, sonra gerçek
# MSVC binary'sine karşı crypto_vectors (SHA/HMAC/base64 + BCrypt random) · rs256_kat (NCrypt
# rs256 verify/sign) · date_dst (MSVC CRT takvim). Bu dallar Linux CI'da HİÇ egzersizde değil.
#
# 2026-08-12: ilk workflow_dispatch koşumu İLK denemede yeşil (MSVC build + gate 17/17·5/5·7/7,
# ortam hatası yok) → push tetikleyicisi eklendi. main'e her push'ta koşar (release main'den çıkar);
# feature-branch'ler yavaş MSVC ile yorulmasın diye yalnız main + elle-tetik. continue-on-error YOK.
name: windows-tier2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  msvc-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC Release build (look + look-fcgi)
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,12)
          cmake -S cpp -B cpp/build-win -DLOOK_BUILD=$sha
          cmake --build cpp/build-win --config Release --target look look-fcgi
          if (-not (Test-Path cpp/build-win/Release/lk.exe))      { throw "lk.exe uretilmedi" }
          if (-not (Test-Path cpp/build-win/Release/lk-fcgi.exe)) { throw "lk-fcgi.exe uretilmedi" }

      # Windows-only dallar (NCrypt rs256 · BCrypt random/sha256 · MSVC CRT date) yalnız GERÇEK
      # MSVC binary'sinde koşar. Herhangi biri kırmızıysa iş düşer (sessiz-delik yok).
      - name: Pre-release gate (MSVC binary'sine karşı)
        shell: pwsh
        run: |
          $lk = "cpp/build-win/Release/lk.exe"
          foreach ($t in @("cpp/tests/crypto_vectors.lk","cpp/tests/rs256_kat.lk","cpp/tests/date_dst_test.lk")) {
            Write-Host "== $t =="
            & $lk $t
            if ($LASTEXITCODE -ne 0) { throw "GATE RED: $t Windows binary'sinde FAIL (exit $LASTEXITCODE)" }
          }
          Write-Host "PASS: Windows Tier-2 gate (crypto_vectors + rs256_kat + date_dst)"
