name: Docker Hub publish (tarball → load → push, rebuild YOK)

# Publishes Docker Hub from the CURRENT look-docker.tar.gz in GitHub v1.0 -- DOES NOT REBUILD
# (release.yml's conditional Hub step needs a ~10 min build per tag; this one uses the
# verified tarball directly). Why it is separate: Docker Hub is a distribution surface independent of GitHub v1.0 and
# goes stale easily (`docker run codlook/look` pulls the old image) -- the twin of GitHub drift.
#
# Triggered manually (Actions -> Run workflow) OR via the API. If the secret is MISSING, login/push is skipped
# (dry run: tarball load + tag are verified, so "added but does it work?" is not left open).
#
# PREREQUISITE: repo secret DOCKERHUB_TOKEN (Settings -> Secrets -> Actions). The username is fixed (codlook).
# ⚠️ THE TOKEN PERMISSION MUST BE **Read & Write**. A read-only token gives a cryptic "denied/insufficient scopes"
#    on push (it happened once on 2026-08-06: the first token was Public-Repo-Read-only). Check when renewing the token.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Hangi GitHub release tag'inden çekilsin (varsayılan v1.0)"
        required: false
        default: "v1.0"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: codlook   # public namespace -- fixed; only the TOKEN is a secret
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: look-docker.tar.gz indir (release tarball, güncel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'look-docker.tar.gz' --dir . --clobber
          ls -lh look-docker.tar.gz

      - name: docker load + tag doğrula (secret olmadan da koşar)
        run: |
          set -e
          # The image tag is read from inside the tarball (codlook/look:<version>); the version is not embedded here.
          IMG="$(docker load < look-docker.tar.gz | sed -n 's/^Loaded image: //p' | head -1)"
          [ -n "$IMG" ] || { echo "::error::no image in the tarball"; exit 1; }
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          echo "=== yüklenen imaj ($IMG) + LOOK damgası ==="
          docker images codlook/look
          # read the stamp from the image (git-sha; if it is "src"/"docker" the release.yml stamp bug is back)
          docker run --rm "$IMG" lk --version || true

      - name: Docker Hub push (secret varsa; yoksa atla)
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        run: |
          set -e
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "$IMG" codlook/look:latest
          docker push "$IMG"
          docker push codlook/look:latest
          echo "Docker Hub güncellendi: $IMG + :latest"

      - name: Secret yoksa uyar (kuru-prova sonucu)
        if: ${{ env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "::warning::DOCKERHUB_TOKEN secret'ı yok — tarball load+tag DOĞRULANDI ama push ATLANDI."
          echo "Settings → Secrets → Actions: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN ekleyip tekrar çalıştır."
