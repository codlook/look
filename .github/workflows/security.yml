name: Security & Sanitizers

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  sanitizers:
    name: "Regression under ASan/UBSan"
    runs-on: ubuntu-latest
    timeout-minutes: 20   # güvenlik ağı: ASan HTTP smoke'ta --max-time'sız curl bir deadlock'ta asılırsa erken kes

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev curl

      # (Release build + regresyon için bkz. ci.yml — burası yalnızca sanitizer.)
      - name: Build (ASan + UBSan)
        run: |
          cd cpp
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DLOOK_SANITIZE=address,undefined
          cmake --build build-asan --target look --target look-fcgi --parallel $(nproc)

      # Regresyon suite'i ASan+UBSan altında — dil işlemleri sırasında bellek
      # hatası / tanımsız davranış varsa sanitizer abort eder, iş kırılır.
      - name: Regression suite (ASan + UBSan)
        run: |
          cd cpp
          out="$(./build-asan/lk tests/regression_all.lk)"
          echo "$out"
          echo "$out" | grep -q '^FAIL' && { echo "::error::Regression FAILED (ASan)"; exit 1; } || true
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

      # HTTP sunucusunu ASan altında ayağa kaldır, normal + bozuk istekler gönder,
      # worker'ın hayatta kaldığını (sanitizer abort YOK) doğrula.
      - name: HTTP smoke under ASan
        run: |
          printf 'route("GET","/",function(){response::json(["ok"=>true])})\nroute("GET","/sess",function(){session::start();session::set("k","v");response::json(["has"=>session::has("k"),"no"=>session::has("z")])})\nroute("404",function(){response::status(404);response::json(["ok"=>false])})\n' > /tmp/app.lk
          ASAN_OPTIONS="halt_on_error=1:abort_on_error=1:detect_leaks=0" cpp/build-asan/lk-fcgi --mode http --port 7411 /tmp/app.lk &
          SRV=$!
          sleep 3
          curl -s "http://127.0.0.1:7411/" | grep -q '"ok":true'
          # session::has — docs'ta belgeli, bir dönem EKSİKTİ (dogfooding #1). set→has=true, olmayan=false.
          curl -s "http://127.0.0.1:7411/sess" | grep -q '"has":true,"no":false' || { echo "::error::session::has KIRIK"; exit 1; }
          curl -s "http://127.0.0.1:7411/yok" > /dev/null           # 404 yolu
          printf 'GET / HTTP/1.1\r\nContent-Length: abc\r\n\r\n' | curl -s --max-time 3 "http://127.0.0.1:7411/" > /dev/null || true
          # sunucu hâlâ ayakta mı? (ASan çökmesi olsaydı bağlantı reddedilirdi)
          curl -s --max-time 3 "http://127.0.0.1:7411/" | grep -q '"ok":true'
          kill $SRV 2>/dev/null || true

  tsan:
    name: "ThreadSanitizer (blocking mode)"
    runs-on: ubuntu-latest
    timeout-minutes: 20   # güvenlik ağı: hang olursa 6-saat GitHub varsayılanı yerine erken kes
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev curl

      # TSan blocking-mode data race taraması. Fiber path'i ucontext annotation
      # gerektirdiği için ayrı; burada production default (blocking) taranır.
      - name: Build (TSan)
        run: |
          cd cpp
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DLOOK_SANITIZE=thread
          cmake --build build-tsan --target look-fcgi --parallel $(nproc)

      - name: Concurrent dispatch under TSan
        run: |
          printf 'route("GET","/ping",function(){response::json(["pong"=>true])})\n' > /tmp/tsan_app.lk
          TSAN_OPTIONS="halt_on_error=0" cpp/build-tsan/lk-fcgi --mode http --port 7411 --workers 8 /tmp/tsan_app.lk &
          SRV=$!
          sleep 3
          # SADECE curl PID'lerini bekle — argümansız 'wait' sunucuyu ($SRV, --mode http sonsuz) da
          # beklerdi → asla dönmez, 'kill $SRV' hiç çalışmaz, job 6 saat hang olurdu (kök-neden).
          pids=""
          for i in $(seq 1 500); do curl -s "http://127.0.0.1:7411/ping" > /dev/null & pids="$pids $!"; done
          wait $pids
          kill $SRV 2>/dev/null || true
        continue-on-error: true  # TSan bulguları baseline kurulana dek uyarı
